<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <!-- 禁用户缩放:与 index.html 同款 app 质感 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>story profile</title>
  <meta name="application-name" content="story profile" />
  <link rel="icon" type="image/png" sizes="512x512" href="/story-profile-icon-v2.png" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="story profile" />
  <meta property="og:description" content="记下你的口味、角色和走过的故事。" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="story profile" />
  <meta name="twitter:description" content="记下你的口味、角色和走过的故事。" />
  <link rel="stylesheet" href="console.css" />
</head>
<body data-doc-title="appWindowTitleActor">
  <main id="acPage" class="acPage">
    <div class="acTopbar">
      <button id="acBack" class="acBack hidden" type="button" data-i18n-aria="ariaBack" aria-label="返回酒馆"><span class="acBackMark">‹</span><span data-i18n="ariaBack">返回酒馆</span></button>
      <div class="acTopTitle" data-i18n="docTitleActor">故事档案</div>
    </div>
    <div id="acRoot" class="acCard">
      <div class="acEmpty" data-i18n="acLoading">读取故事档案…</div>
    </div>
    <section id="personalityEditor" class="acPersonality hidden" aria-hidden="true">
      <div class="acPersonalityBar">
        <button id="personalityCancel" class="acTextButton" type="button" data-i18n="personalityCancel">取消</button>
        <div class="acPersonalityTitle" data-i18n="personalityTitle">人格设定</div>
        <button id="personalitySave" class="acTextButton acTextButtonPrimary" type="button" data-i18n="personalitySave">保存</button>
      </div>
      <div class="acPersonalityBody">
        <p class="acPersonalityHint" data-i18n="personalityHint">这里决定主理人的性格、语气与相处方式。</p>
        <textarea id="personalityContent" class="acPersonalityInput" spellcheck="false"></textarea>
        <div class="acPersonalityMeta"><span id="personalityStatus"></span><span id="personalityCount"></span></div>
      </div>
    </section>
  </main>
  <script src="i18n.js"></script>
  <script src="security.js"></script>
  <script src="actor.js"></script>
</body>
</html>
