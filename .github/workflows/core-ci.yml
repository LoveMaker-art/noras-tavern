name: Nora Tavern core
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Test the same Git bytes used by stable construction
        run: git -c core.autocrlf=false -c core.eol=lf checkout-index --force --all
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node tooling/maintenance-input.mjs fetch
      - name: Prepare Python consumer fixtures
        run: |
          python -m venv .cache/test-venv
          py="$PWD/.cache/test-venv/bin/python"
          "$py" -m pip install -r requirements-core-test.txt
          py="$("$py" -B -c 'import sys; print(sys.executable)')"
          printf 'NORA_TEST_PYTHON=%s\n' "$py" >> "$GITHUB_ENV"
      - run: npm --prefix app/engine/sillytavern ci --no-audit --no-fund
      - run: npm --prefix nora-mcp ci --ignore-scripts --no-audit --no-fund
      - run: node tooling/checks/core-source-gate.mjs
