name: Build and accept system update components (no publication)

on:
  workflow_dispatch:
    inputs:
      baseline_tag:
        description: Published stable tag with verified Hermes and dependencies to reuse
        required: true
        type: string
      publication_tag:
        description: Explicit component publication batch (blank keeps v<core-version>)
        type: string
        default: ''
      compatibility_file:
        description: Reviewed committed compatibility JSON (blank selects compatibility/v<core-version>.json)
        type: string
        default: ''
      product_source_run:
        description: Original successful component build whose immutable ZIP is revalidated; no new product is constructed
        type: string
        default: ''
      product_source_tag:
        description: Original product tag (required with product_source_run)
        type: string
        default: ''
      force_full_regression:
        description: Run complete regression for periodic qualification; cannot reduce required coverage
        type: boolean
        default: false

# Both release paths share a lock; they must never upload to one tag concurrently.
concurrency:
  group: nora-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  build-components:
    if: github.ref_type == 'tag' || inputs.product_source_run != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      product_commit: ${{ steps.product.outputs.product_commit }}
      product_tag: ${{ steps.product.outputs.product_tag }}
      delivery_artifact_id: ${{ steps.delivery.outputs.artifact-id }}
      delivery_artifact_digest: ${{ steps.delivery.outputs.artifact-digest }}
      regression_baseline: ${{ steps.baselines.outputs.regression_baseline }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BASELINE_TAG: ${{ inputs.baseline_tag }}
      PYTHONUTF8: '1'
      NORA_PRODUCT_SOURCE_RUN: ${{ inputs.product_source_run }}
      NORA_PRODUCT_SOURCE_TAG: ${{ inputs.product_source_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            app/engine/sillytavern/package-lock.json
            nora-mcp/npm-shrinkwrap.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve explicit component publication inputs
        env:
          BUILD_PUBLICATION_TAG: ${{ inputs.publication_tag }}
          BUILD_COMPATIBILITY_FILE: ${{ inputs.compatibility_file }}
        run: node tooling/release/system-release.mjs --workflow-options
      - name: Fix regression and upgrade baselines before downloading product payloads
        id: baselines
        shell: bash
        run: |
          set -euo pipefail
          facts="$RUNNER_TEMP/component-published-releases.json"
          timeout --signal=TERM --kill-after=5s 120s gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --slurp > "$facts"
          target_tag="${NORA_PRODUCT_SOURCE_TAG:-$NORA_PUBLICATION_TAG}"
          node "$PWD/tooling/release/publication-source.cjs" baseline-selection "$facts" "$target_tag" "$GITHUB_REPOSITORY" "$BASELINE_TAG" "$RUNNER_TEMP/component-upgrade-baseline.json" "$GITHUB_OUTPUT" build
          node -e 'const fs=require("node:fs"),assert=require("node:assert/strict"),{selectPlanningBaseline}=require("./tooling/release/publication-source.cjs");const baseline=process.env.NORA_PRODUCT_SOURCE_TAG||selectPlanningBaseline(JSON.parse(fs.readFileSync(process.argv[1])));assert.match(baseline,/^v[0-9]+\.[0-9]+\.[0-9]+$/);fs.appendFileSync(process.env.GITHUB_ENV,"REGRESSION_BASELINE="+baseline+"\n");fs.appendFileSync(process.env.GITHUB_OUTPUT,"regression_baseline="+baseline+"\n");' "$facts"
      - name: Resolve product identity or restore the exact original product ZIP
        id: product
        run: node tooling/release/publication-source.cjs restore-product
      - name: Plan component changes before compilation
        if: inputs.product_source_run == ''
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          node tooling/release/release-plan.mjs --base "$REGRESSION_BASELINE" --head "$GITHUB_SHA" --output "$RUNNER_TEMP/release-plan.json" --github-output "$GITHUB_OUTPUT"
      - name: Require an explicitly compatible component plan
        if: inputs.product_source_run == ''
        env:
          PLAN_MODE: ${{ steps.plan.outputs.mode }}
          REQUIRES_REVIEW: ${{ steps.plan.outputs.requires_review }}
        run: |
          test "$PLAN_MODE" = components || exit 1
          test "$REQUIRES_REVIEW" = false || exit 1
      - name: Install test dependencies
        run: |
          python -m pip install PyYAML==6.0.2 psutil==7.0.0
          npm ci --prefix launcher/desktop --ignore-scripts --no-audit --no-fund
      - name: Select regression from the fixed component baseline
        id: test-impact
        run: node tooling/checks/launcher-test-impact.mjs --base "$REGRESSION_BASELINE" --head "$GITHUB_SHA" --force-full "${{ inputs.force_full_regression || false }}" --output "$RUNNER_TEMP/test-impact.json" --github-output "$GITHUB_OUTPUT"
      - name: Audit release fixture entries before product preparation
        run: node tooling/checks/release-fixtures.mjs
      - name: Verify release contracts and update preservation
        shell: bash
        run: |
          set -euo pipefail
          node app/engine/sillytavern/build/sync-story-profile-runtime.mjs --check
          node --test tests/release-plan.test.mjs tests/asset-catalogue.test.mjs tests/acceptance-baseline.test.mjs tests/publication-source.test.cjs tests/release-workflow.test.mjs tests/repository-layout.test.mjs tests/component-release.test.mjs tests/component-native-acceptance.test.mjs tests/launcher-release-notes.test.cjs tests/launcher-test-impact.test.mjs
          node "$PWD/tooling/run.mjs" node --test tests/deployment/updater_worlds.test.mjs tests/deployment/launcher_system_update.test.cjs
      - name: Require chat backup safety tests
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix app/engine/sillytavern --ignore-scripts --no-audit --no-fund
          npm ci --prefix nora-mcp --ignore-scripts --no-audit --no-fund
          node --test tests/backup-safety-gate.test.mjs
          node tooling/checks/verify-backup-safety.mjs
      - name: Require the selected component source regression
        shell: bash
        env:
          FULL_REGRESSION: ${{ steps.test-impact.outputs.full }}
        run: |
          set -euo pipefail
          export NORA_TEST_PYTHON="$(python -B -c 'import sys;print(sys.executable,end="")')"
          case "$FULL_REGRESSION" in
            true) node "$PWD/tooling/checks/verify-launcher-stability.mjs" ;;
            false) node "$PWD/tooling/checks/launcher-test-impact.mjs" --base "$REGRESSION_BASELINE" --head "$GITHUB_SHA" --run-focused ;;
            *) echo 'Missing verified test selection' >&2; exit 1 ;;
          esac
      - name: Check affected Tavern frontend against existing Nora contracts
        if: steps.test-impact.outputs.tavern == 'true'
        timeout-minutes: 15
        run: node "$PWD/tooling/run.mjs" npm --prefix app/engine/sillytavern run test:nora
      - name: Build only shared application and updater components
        if: inputs.product_source_run == ''
        shell: bash
        run: |
          set -euo pipefail
          publication_args=()
          if [[ -n "$NORA_COMPONENT_PUBLICATION_TAG" ]]; then publication_args+=(--publication-tag "$NORA_COMPONENT_PUBLICATION_TAG"); fi
          if [[ -n "$NORA_UPDATE_COMPATIBILITY_FILE" ]]; then publication_args+=(--update-compatibility "$NORA_UPDATE_COMPATIBILITY_FILE"); fi
          node tooling/release/package-release.mjs --components-only "${publication_args[@]}"
      - name: Reuse verified environments and seal three system manifests
        if: inputs.product_source_run == ''
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$(find release -maxdepth 1 -type d -name 'stable-*' | sort | tail -n 1)"
          node tooling/release/package-component-update.mjs "$release_dir" "$BASELINE_TAG" artifacts
      - name: Verify the frozen component delivery before native acceptance
        if: inputs.product_source_run == ''
        shell: bash
        run: |
          set -euo pipefail
          node tooling/release/verify-launcher-release.cjs artifacts "$GITHUB_REF_NAME" "$GITHUB_SHA" components
      - name: Preserve accepted component delivery
        id: delivery
        uses: actions/upload-artifact@v4
        with:
          name: nora-component-delivery
          overwrite: true
          path: ${{ steps.product.outputs.upload_root }}/**
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Preserve component change plan on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nora-release-plan
          overwrite: true
          path: |
            ${{ runner.temp }}/release-plan.json
            ${{ runner.temp }}/test-impact.json
          if-no-files-found: warn
          retention-days: 90

  prepare-platform-inputs:
    needs: build-components
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      delivery_arm64_id: ${{ steps.delivery-arm64.outputs.artifact-id }}
      delivery_arm64_digest: ${{ steps.delivery-arm64.outputs.artifact-digest }}
      delivery_intel_id: ${{ steps.delivery-intel.outputs.artifact-id }}
      delivery_intel_digest: ${{ steps.delivery-intel.outputs.artifact-digest }}
      delivery_windows_id: ${{ steps.delivery-windows.outputs.artifact-id }}
      delivery_windows_digest: ${{ steps.delivery-windows.outputs.artifact-digest }}
    env:
      GH_TOKEN: ${{ github.token }}
      PRODUCT_COMMIT: ${{ needs.build-components.outputs.product_commit }}
      PRODUCT_TAG: ${{ needs.build-components.outputs.product_tag }}
      NORA_PRODUCT_SOURCE_RUN: ${{ inputs.product_source_run }}
      NORA_PRODUCT_SOURCE_TAG: ${{ inputs.product_source_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - uses: actions/download-artifact@v4
        with:
          name: nora-component-delivery
          path: ${{ runner.temp }}/component-delivery
      - name: Normalize the original or newly built component delivery
        run: node "$PWD/tooling/release/publication-source.cjs" unwrap-product "$RUNNER_TEMP/component-delivery" "$RUNNER_TEMP/component-original"
      - name: Prepare platform-only inputs from the same complete delivery
        run: node tooling/release/component-acceptance.mjs split "$COMPONENT_DELIVERY" "$RUNNER_TEMP/component-platform-delivery" "$PRODUCT_COMMIT"
      - name: Preserve ARM platform input
        id: delivery-arm64
        uses: actions/upload-artifact@v4
        with:
          name: nora-component-delivery-darwin-arm64
          overwrite: true
          path: ${{ runner.temp }}/component-platform-delivery/darwin-arm64/**
          compression-level: 0
          if-no-files-found: error
          retention-days: 90
      - name: Preserve Intel platform input
        id: delivery-intel
        uses: actions/upload-artifact@v4
        with:
          name: nora-component-delivery-darwin-x64
          overwrite: true
          path: ${{ runner.temp }}/component-platform-delivery/darwin-x64/**
          compression-level: 0
          if-no-files-found: error
          retention-days: 90
      - name: Preserve Windows platform input
        id: delivery-windows
        uses: actions/upload-artifact@v4
        with:
          name: nora-component-delivery-win32-x64
          overwrite: true
          path: ${{ runner.temp }}/component-platform-delivery/win32-x64/**
          compression-level: 0
          if-no-files-found: error
          retention-days: 90

  native-components:
    needs: [build-components, prepare-platform-inputs]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin-arm64
          - runner: macos-15-intel
            platform: darwin-x64
          - runner: windows-latest
            platform: win32-x64
    uses: ./.github/workflows/component-platform-stages.yml
    with:
      runner: ${{ matrix.runner }}
      platform: ${{ matrix.platform }}
      product_commit: ${{ needs.build-components.outputs.product_commit }}
      product_tag: ${{ needs.build-components.outputs.product_tag }}
      product_source_run: ${{ inputs.product_source_run }}
      delivery_artifact_id: ${{ matrix.platform == 'darwin-arm64' && needs.prepare-platform-inputs.outputs.delivery_arm64_id || matrix.platform == 'darwin-x64' && needs.prepare-platform-inputs.outputs.delivery_intel_id || needs.prepare-platform-inputs.outputs.delivery_windows_id }}
      delivery_artifact_digest: ${{ matrix.platform == 'darwin-arm64' && needs.prepare-platform-inputs.outputs.delivery_arm64_digest || matrix.platform == 'darwin-x64' && needs.prepare-platform-inputs.outputs.delivery_intel_digest || needs.prepare-platform-inputs.outputs.delivery_windows_digest }}
      baseline_tag: ${{ inputs.baseline_tag }}
      regression_baseline: ${{ needs.build-components.outputs.regression_baseline }}
      force_full_regression: ${{ inputs.force_full_regression || false }}

  accept-components:
    needs: [build-components, native-components]
    env:
      GH_TOKEN: ${{ github.token }}
      COMPONENT_PLAN_FILE: ${{ runner.temp }}/component-plan/release-plan.json
      PRODUCT_COMMIT: ${{ needs.build-components.outputs.product_commit }}
      PRODUCT_TAG: ${{ needs.build-components.outputs.product_tag }}
      NORA_PRODUCT_SOURCE_RUN: ${{ inputs.product_source_run }}
      NORA_PRODUCT_SOURCE_TAG: ${{ inputs.product_source_tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: nora-component-delivery
          path: ${{ runner.temp }}/component-delivery
      - uses: actions/download-artifact@v4
        with:
          pattern: nora-component-native-*
          path: ${{ runner.temp }}/component-native
      - uses: actions/download-artifact@v4
        with:
          name: nora-release-plan
          path: ${{ runner.temp }}/component-plan
      - name: Normalize the original or newly built component delivery
        run: node tooling/release/publication-source.cjs unwrap-product "${{ runner.temp }}/component-delivery" "${{ runner.temp }}/component-original"
      - name: Accept only complete three-platform native evidence for these bytes
        shell: bash
        env:
          BASELINE_TAG: ${{ inputs.baseline_tag }}
        run: |
          set -euo pipefail
          node tooling/release/component-acceptance.mjs seal "$COMPONENT_DELIVERY" "$RUNNER_TEMP/component-native" "$RUNNER_TEMP/component-plan/release-plan.json" "$RUNNER_TEMP/component-acceptance.json" "$PRODUCT_COMMIT" "$PRODUCT_TAG" "$BASELINE_TAG"
      - name: Preserve final native-accepted component receipt
        uses: actions/upload-artifact@v4
        with:
          name: nora-component-acceptance
          path: ${{ runner.temp }}/component-acceptance.json
          if-no-files-found: error
          retention-days: 90
