name: Build and accept system update components (no publication)

on:
  workflow_dispatch:
    inputs:
      baseline_tag:
        description: Published stable tag with verified Hermes and dependencies to reuse
        required: true
        type: string

# Both release paths share a lock; they must never upload to one tag concurrently.
concurrency:
  group: nora-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-components:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BASELINE_TAG: ${{ inputs.baseline_tag }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify committed release identity
        shell: bash
        run: test "$GITHUB_REF_NAME" = "v$(cat app/.tavern-release-version)"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            app/engine/sillytavern/package-lock.json
            nora-mcp/npm-shrinkwrap.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Plan component changes before compilation
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          node tooling/release/release-plan.mjs --base "$BASELINE_TAG" --head "$GITHUB_SHA" --output "$RUNNER_TEMP/release-plan.json" --github-output "$GITHUB_OUTPUT"
      - name: Require an explicitly compatible component plan
        env:
          PLAN_MODE: ${{ steps.plan.outputs.mode }}
          REQUIRES_REVIEW: ${{ steps.plan.outputs.requires_review }}
        run: |
          test "$PLAN_MODE" = components || exit 1
          test "$REQUIRES_REVIEW" = false || exit 1
      - name: Install test dependencies
        run: |
          python -m pip install PyYAML==6.0.2
          npm ci --prefix launcher/desktop --ignore-scripts --no-audit --no-fund
      - name: Verify release contracts and update preservation
        run: |
          node app/engine/sillytavern/build/sync-story-profile-runtime.mjs --check
          node --test tests/release-plan.test.mjs tests/asset-catalogue.test.mjs tests/acceptance-baseline.test.mjs tests/publication-source.test.cjs tests/release-workflow.test.mjs tests/repository-layout.test.mjs tests/component-release.test.mjs tests/launcher-release-notes.test.cjs
          node tooling/run.mjs node --test tests/deployment/updater_worlds.test.mjs tests/deployment/launcher_system_update.test.cjs
          node tooling/run.mjs python -B -m unittest tests.deployment.test_update_target tests.deployment.test_update_download_sources tests.deployment.test_incremental_update tests.deployment.test_update_check tests.deployment.test_managed_update tests.deployment.test_update_dependency_materialization tests.deployment.test_update_recovery tests.deployment.test_launcher_update_recovery tests.deployment.test_update_error_diagnostics tests.deployment.test_native_startup_evidence tests.deployment.test_native_cli_diagnostics
      - name: Require chat backup safety tests
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix app/engine/sillytavern --ignore-scripts --no-audit --no-fund
          npm ci --prefix nora-mcp --ignore-scripts --no-audit --no-fund
          node --test tests/backup-safety-gate.test.mjs
          node tooling/checks/verify-backup-safety.mjs
      - name: Build only shared application and updater components
        run: node tooling/release/package-release.mjs --components-only
      - name: Reuse verified environments and seal three system manifests
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$(find release -maxdepth 1 -type d -name 'stable-*' | sort | tail -n 1)"
          node tooling/release/package-component-update.mjs "$release_dir" "$BASELINE_TAG" artifacts
      - name: Accept the exact component delivery without publishing
        shell: bash
        run: |
          set -euo pipefail
          node tooling/release/verify-launcher-release.cjs artifacts "$GITHUB_REF_NAME" "$GITHUB_SHA" components
          node -e 'const fs=require("node:fs"),crypto=require("node:crypto"),path=require("node:path");const inventory={};for(const name of fs.readdirSync("artifacts",{recursive:true})){const p=path.join("artifacts",name);if(fs.statSync(p).isFile())inventory[name]={size:fs.statSync(p).size,sha256:crypto.createHash("sha256").update(fs.readFileSync(p)).digest("hex")};}fs.writeFileSync(path.join(process.env.RUNNER_TEMP,"component-acceptance.json"),JSON.stringify({schema:"nora-component-acceptance/1",commit:process.env.GITHUB_SHA,tag:process.env.GITHUB_REF_NAME,outcome:"passed",files:inventory},null,2)+"\n")'
      - name: Preserve accepted component delivery
        uses: actions/upload-artifact@v4
        with:
          name: nora-component-delivery
          path: artifacts/**
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Preserve accepted component evidence
        uses: actions/upload-artifact@v4
        with:
          name: nora-component-acceptance
          path: ${{ runner.temp }}/component-acceptance.json
          if-no-files-found: error
          retention-days: 90
      - name: Preserve component change plan on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nora-release-plan
          path: ${{ runner.temp }}/release-plan.json
          if-no-files-found: warn
          retention-days: 90
