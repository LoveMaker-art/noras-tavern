name: Build and accept system update components (no publication)

on:
  workflow_dispatch:
    inputs:
      baseline_tag:
        description: Published stable tag with verified Hermes and dependencies to reuse
        required: true
        type: string
      publication_tag:
        description: Explicit component publication batch (blank keeps v<core-version>)
        type: string
        default: ''
      compatibility_file:
        description: Reviewed committed compatibility JSON (blank selects compatibility/v<core-version>.json)
        type: string
        default: ''
      force_full_regression:
        description: Run complete regression for periodic qualification; cannot reduce required coverage
        type: boolean
        default: false

# Both release paths share a lock; they must never upload to one tag concurrently.
concurrency:
  group: nora-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  build-components:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BASELINE_TAG: ${{ inputs.baseline_tag }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            app/engine/sillytavern/package-lock.json
            nora-mcp/npm-shrinkwrap.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve explicit component publication inputs
        env:
          BUILD_PUBLICATION_TAG: ${{ inputs.publication_tag }}
          BUILD_COMPATIBILITY_FILE: ${{ inputs.compatibility_file }}
        run: node tooling/release/system-release.mjs --workflow-options
      - name: Plan component changes before compilation
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          node tooling/release/release-plan.mjs --base "$BASELINE_TAG" --head "$GITHUB_SHA" --output "$RUNNER_TEMP/release-plan.json" --github-output "$GITHUB_OUTPUT"
      - name: Require an explicitly compatible component plan
        env:
          PLAN_MODE: ${{ steps.plan.outputs.mode }}
          REQUIRES_REVIEW: ${{ steps.plan.outputs.requires_review }}
        run: |
          test "$PLAN_MODE" = components || exit 1
          test "$REQUIRES_REVIEW" = false || exit 1
      - name: Install test dependencies
        run: |
          python -m pip install PyYAML==6.0.2 psutil==7.0.0
          npm ci --prefix launcher/desktop --ignore-scripts --no-audit --no-fund
      - name: Select regression from the fixed component baseline
        id: test-impact
        run: node tooling/checks/launcher-test-impact.mjs --base "$BASELINE_TAG" --head "$GITHUB_SHA" --force-full "${{ inputs.force_full_regression || false }}" --output "$RUNNER_TEMP/test-impact.json" --github-output "$GITHUB_OUTPUT"
      - name: Audit release fixture entries before product preparation
        run: node tooling/checks/release-fixtures.mjs
      - name: Verify release contracts and update preservation
        shell: bash
        run: |
          set -euo pipefail
          node app/engine/sillytavern/build/sync-story-profile-runtime.mjs --check
          node --test tests/release-plan.test.mjs tests/asset-catalogue.test.mjs tests/acceptance-baseline.test.mjs tests/publication-source.test.cjs tests/release-workflow.test.mjs tests/repository-layout.test.mjs tests/component-release.test.mjs tests/component-native-acceptance.test.mjs tests/launcher-release-notes.test.cjs tests/launcher-test-impact.test.mjs
          node "$PWD/tooling/run.mjs" node --test tests/deployment/updater_worlds.test.mjs tests/deployment/launcher_system_update.test.cjs
      - name: Require chat backup safety tests
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix app/engine/sillytavern --ignore-scripts --no-audit --no-fund
          npm ci --prefix nora-mcp --ignore-scripts --no-audit --no-fund
          node --test tests/backup-safety-gate.test.mjs
          node tooling/checks/verify-backup-safety.mjs
      - name: Require the selected component source regression
        shell: bash
        env:
          FULL_REGRESSION: ${{ steps.test-impact.outputs.full }}
        run: |
          set -euo pipefail
          export NORA_TEST_PYTHON="$(python -B -c 'import sys;print(sys.executable,end="")')"
          case "$FULL_REGRESSION" in
            true) node "$PWD/tooling/run.mjs" python -B -m unittest tests.deployment.test_update_dependency_materialization tests.deployment.test_update_operation_safety tests.deployment.test_updater_task_backend tests.deployment.test_standalone_update_recovery ;;
            false) node "$PWD/tooling/checks/launcher-test-impact.mjs" --base "$BASELINE_TAG" --head "$GITHUB_SHA" --run-focused ;;
            *) echo 'Missing verified test selection' >&2; exit 1 ;;
          esac
      - name: Check independent update and data contracts outside the full gate
        # These retain their own entry/fixture coverage; full-gate modules are not run twice here.
        if: steps.test-impact.outputs.full == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node "$PWD/tooling/run.mjs" python -B -m unittest tests.deployment.test_update_download_sources tests.deployment.test_incremental_update tests.deployment.test_update_check tests.deployment.test_managed_update tests.deployment.test_native_startup_evidence tests.deployment.test_native_cli_diagnostics
      - name: Check affected Tavern frontend against existing Nora contracts
        if: steps.test-impact.outputs.tavern == 'true'
        timeout-minutes: 15
        run: node "$PWD/tooling/run.mjs" npm --prefix app/engine/sillytavern run test:nora
      - name: Build only shared application and updater components
        shell: bash
        run: |
          set -euo pipefail
          publication_args=()
          if [[ -n "$NORA_COMPONENT_PUBLICATION_TAG" ]]; then publication_args+=(--publication-tag "$NORA_COMPONENT_PUBLICATION_TAG"); fi
          if [[ -n "$NORA_UPDATE_COMPATIBILITY_FILE" ]]; then publication_args+=(--update-compatibility "$NORA_UPDATE_COMPATIBILITY_FILE"); fi
          node tooling/release/package-release.mjs --components-only "${publication_args[@]}"
      - name: Reuse verified environments and seal three system manifests
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$(find release -maxdepth 1 -type d -name 'stable-*' | sort | tail -n 1)"
          node tooling/release/package-component-update.mjs "$release_dir" "$BASELINE_TAG" artifacts
      - name: Verify the frozen component delivery before native acceptance
        shell: bash
        run: |
          set -euo pipefail
          node tooling/release/verify-launcher-release.cjs artifacts "$GITHUB_REF_NAME" "$GITHUB_SHA" components
      - name: Preserve accepted component delivery
        uses: actions/upload-artifact@v4
        with:
          name: nora-component-delivery
          path: artifacts/**
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Preserve component change plan on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nora-release-plan
          path: |
            ${{ runner.temp }}/release-plan.json
            ${{ runner.temp }}/test-impact.json
          if-no-files-found: warn
          retention-days: 90

  native-components:
    needs: build-components
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin-arm64
          - runner: macos-15-intel
            platform: darwin-x64
          - runner: windows-latest
            platform: win32-x64
    uses: ./.github/workflows/component-platform-stages.yml
    with:
      runner: ${{ matrix.runner }}
      platform: ${{ matrix.platform }}
      baseline_tag: ${{ inputs.baseline_tag }}
      force_full_regression: ${{ inputs.force_full_regression || false }}

  accept-components:
    needs: [build-components, native-components]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: nora-component-delivery
          path: ${{ runner.temp }}/component-delivery
      - uses: actions/download-artifact@v4
        with:
          pattern: nora-component-native-*
          path: ${{ runner.temp }}/component-native
      - uses: actions/download-artifact@v4
        with:
          name: nora-release-plan
          path: ${{ runner.temp }}/component-plan
      - name: Accept only complete three-platform native evidence for these bytes
        shell: bash
        env:
          BASELINE_TAG: ${{ inputs.baseline_tag }}
        run: |
          set -euo pipefail
          node tooling/release/component-acceptance.mjs seal "$RUNNER_TEMP/component-delivery" "$RUNNER_TEMP/component-native" "$RUNNER_TEMP/component-plan/release-plan.json" "$RUNNER_TEMP/component-acceptance.json" "$GITHUB_SHA" "$GITHUB_REF_NAME" "$BASELINE_TAG"
      - name: Preserve final native-accepted component receipt
        uses: actions/upload-artifact@v4
        with:
          name: nora-component-acceptance
          path: ${{ runner.temp }}/component-acceptance.json
          if-no-files-found: error
          retention-days: 90
