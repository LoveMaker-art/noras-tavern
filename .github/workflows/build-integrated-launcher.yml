name: Build and accept Nora Tavern installers (no publication)

on:
  workflow_dispatch:
    inputs:
      target:
        description: Build installers or check an existing sealed Windows package
        type: choice
        default: all
        options:
          - all
          - win32-x64
          - win32-package-check
      package_source_run:
        description: Diagnostic only - run whose saved Windows package is checked without rebuilding
        type: string
        default: ''
      runtime_source_run:
        description: Optional verified build run whose Hermes archives are reused for install compatibility
        type: string
        default: ''
      acceptance_baseline_tag:
        description: Published stable version used only for historical upgrade acceptance (blank uses latest stable; EMPTY requires no stable history)
        type: string
        default: ''
      launcher_baseline_tag:
        description: Launcher-only build using verified unchanged components from a stable tag (otherwise full build)
        type: string
        default: ''
      production_mode:
        description: Use real installation paths for replacement testing (branch artifacts only)
        type: boolean
        default: false
      planning_baseline:
        description: Change-plan base tag or commit (blank uses latest stable; EMPTY only for the first release)
        type: string
        default: ''
      approve_unknown_inputs:
        description: Explicitly approve reviewed unknown build inputs and require a conservative full build
        type: boolean
        default: false
      verified_windows_run:
        description: Final all-platform assembly reusing a fully accepted Windows-only run at this exact commit
        type: string
        default: ''
  push:
    tags:
      - 'v*-beta.*'

concurrency:
  group: nora-release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read
  actions: read

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'

jobs:
  preflight:
    if: inputs.target != 'win32-package-check' && inputs.package_source_run == ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      acceptance_baseline_tag: ${{ steps.acceptance-baseline.outputs.acceptance_baseline_tag }}
      initial_release: ${{ steps.acceptance-baseline.outputs.initial_release }}
    env:
      GH_TOKEN: ${{ github.token }}
      PLANNING_BASELINE: ${{ inputs.planning_baseline }}
      APPROVE_UNKNOWN_INPUTS: ${{ inputs.approve_unknown_inputs }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the workflow contract parser
        run: python -m pip install PyYAML==6.0.2
      - name: Select a published acceptance baseline independently of environment reuse
        id: acceptance-baseline
        shell: bash
        env:
          ACCEPTANCE_BASELINE_TAG: ${{ inputs.acceptance_baseline_tag }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --slurp > "$RUNNER_TEMP/nora-acceptance-published-releases.json"
          node tooling/release/publication-source.cjs baseline-selection "$RUNNER_TEMP/nora-acceptance-published-releases.json" "v$(cat app/.tavern-release-version)" "$GITHUB_REPOSITORY" "$ACCEPTANCE_BASELINE_TAG" "$RUNNER_TEMP/nora-acceptance-baseline-selection.json" "$GITHUB_OUTPUT" build
      - name: Plan committed changes before native builds
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          baseline="$PLANNING_BASELINE"
          acceptance_baseline="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.env.RUNNER_TEMP+"/nora-acceptance-baseline-selection.json")).tag')"
          if [[ "$baseline" == EMPTY && "$acceptance_baseline" != EMPTY ]]; then echo 'Existing stable history forbids an EMPTY build baseline.' >&2; exit 1; fi
          if [[ -z "$baseline" ]]; then baseline="$acceptance_baseline"; fi
          node tooling/release/release-plan.mjs --base "$baseline" --head "$GITHUB_SHA" --output "$RUNNER_TEMP/release-plan.json" --github-output "$GITHUB_OUTPUT"
      - name: Require a matching build decision and explicit review of unknown inputs
        shell: bash
        env:
          PLAN_MODE: ${{ steps.plan.outputs.mode }}
          REQUIRES_REVIEW: ${{ steps.plan.outputs.requires_review }}
          LAUNCHER_BASELINE_TAG: ${{ inputs.launcher_baseline_tag }}
          RUNTIME_SOURCE_RUN: ${{ inputs.runtime_source_run }}
          VERIFIED_WINDOWS_RUN: ${{ inputs.verified_windows_run }}
        run: |
          set -euo pipefail
          if [[ "$REQUIRES_REVIEW" == true && "$APPROVE_UNKNOWN_INPUTS" != true ]]; then
            echo 'Unknown inputs require a reviewed plan and explicit approve_unknown_inputs=true.' >&2
            exit 1
          fi
          if [[ "$REQUIRES_REVIEW" == true && ( -n "$LAUNCHER_BASELINE_TAG" || -n "$RUNTIME_SOURCE_RUN" || -n "$VERIFIED_WINDOWS_RUN" ) ]]; then
            echo 'Reviewed unknown inputs require a full build without environment or Windows package reuse.' >&2
            exit 1
          fi
          case "$PLAN_MODE" in
            full|launcher|review-required) ;;
            components) echo 'Use the component build workflow for this plan.' >&2; exit 1 ;;
            verification-only) echo 'No product build is required; verify tooling or publish accepted bytes separately.' >&2; exit 1 ;;
            *) exit 1 ;;
          esac
      - name: Check release tooling before preparing runtimes
        run: |
          node --test tests/release-plan.test.mjs tests/asset-catalogue.test.mjs tests/acceptance-baseline.test.mjs tests/publication-source.test.cjs tests/release-workflow.test.mjs tests/launcher-artifact-checks.test.cjs tests/launcher-release-notes.test.cjs tests/repository-layout.test.mjs
      - name: Preserve the change plan even when preflight rejects the build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nora-release-plan
          overwrite: true
          path: |
            ${{ runner.temp }}/release-plan.json
            ${{ runner.temp }}/nora-acceptance-baseline-selection.json
            ${{ runner.temp }}/nora-acceptance-published-releases.json
          if-no-files-found: warn
          retention-days: 90

  package-check:
    if: inputs.target == 'win32-package-check' || inputs.package_source_run != ''
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      NORA_BUILD_TARGET: ${{ inputs.target }}
      NORA_PACKAGE_SOURCE_RUN: ${{ inputs.package_source_run }}
      NORA_RUNTIME_SOURCE_RUN: ${{ inputs.runtime_source_run }}
      NORA_PUBLISH_SOURCE_RUN: ''
      NORA_VERIFIED_WINDOWS_RUN: ${{ inputs.verified_windows_run }}
      NORA_LAUNCHER_BASELINE_TAG: ${{ inputs.launcher_baseline_tag }}
      NORA_PRODUCTION_MODE: ${{ inputs.production_mode }}
    steps:
      - name: Preserve repository bytes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reject publishing or rebuilding in package-check mode
        run: node tooling/checks/restore-launcher-check-package.cjs modes
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure the archive extractor
        shell: pwsh
        run: |
          $python = python -c 'import sys; print(sys.executable)'
          if ($LASTEXITCODE -ne 0) { throw 'Archive extractor is unavailable' }
          "NORA_CHECK_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify the shared check runner before downloading packages
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'tooling/checks/launcher-installed-check.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
          node --test tests/launcher-artifact-checks.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Artifact check runner tests failed' }
      - name: Restore sealed diagnostic package with exact source and API digest checks
        run: node tooling/checks/restore-launcher-check-package.cjs
      - name: Install the frozen package inspection dependencies
        shell: bash
        run: |
          release_dir="$(node tooling/checks/launcher-artifact-checks.cjs release)"
          cd "$release_dir/nora-tavern-launcher/desktop"
          npm ci --ignore-scripts --no-audit --no-fund
          node -e 'const fs=require("node:fs"),path=require("node:path");fs.appendFileSync(process.env.GITHUB_ENV,"NORA_TEST_DESKTOP_NODE_MODULES="+path.resolve("node_modules")+"\n")'
      - name: Restore the packaged native test interpreter
        shell: bash
        run: |
          release_dir="$(node tooling/checks/launcher-artifact-checks.cjs release)"
          node tooling/run.mjs node tooling/release/restore-launcher-runtime.cjs "$release_dir/system-assets" "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/hermes" "$RUNNER_TEMP/hermes-build-source"
      - name: Recreate the expected native icon from the frozen source image
        shell: bash
        run: |
          release_dir="$(node tooling/checks/launcher-artifact-checks.cjs release)"
          node -e 'const p=require("node:path"),desktop=p.resolve(process.argv[1],"nora-tavern-launcher/desktop"),t=require(p.join(desktop,"node_modules/app-builder-lib/out/toolsets/icons.js"));t.runIconsTool({inputFile:p.resolve(desktop,"../assets/nora-launcher-portrait.png"),outputFormat:"ico",outDir:p.join(desktop,"dist/.icon-ico")}).catch(e=>{console.error(e);process.exitCode=1})' "$release_dir"
      - name: Verify actual lightweight update archive
        shell: bash
        run: node tooling/checks/launcher-artifact-checks.cjs replacement
      - name: Test the actual Windows setup and installed application
        timeout-minutes: 10
        shell: pwsh
        run: ./tooling/checks/launcher-installed-check.ps1
      - name: Verify real APP production module closure and executor receipts
        timeout-minutes: 10
        shell: bash
        run: node tooling/checks/launcher-artifact-checks.cjs app
      - name: Verify packaged Nora images and instructions
        shell: bash
        run: node tooling/checks/launcher-artifact-checks.cjs images
      - name: Preserve diagnostic evidence without creating release assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nora-windows-package-check-diagnostic
          overwrite: true
          path: |
            ${{ runner.temp }}/nora-package-check-source.json
            ${{ runner.temp }}/nora-packaged-app-acceptance.json
            ${{ runner.temp }}/nora-installed-*-acceptance.json
            release/*/nora-tavern-launcher/desktop/dist/Nora-Tavern-package-verification-*.json
          if-no-files-found: warn
          retention-days: 90

  reuse-windows:
    needs: preflight
    if: inputs.verified_windows_run != '' && inputs.package_source_run == ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      NORA_VERIFIED_WINDOWS_RUN: ${{ inputs.verified_windows_run }}
      NORA_BUILD_TARGET: ${{ inputs.target }}
      NORA_PUBLISH_SOURCE_RUN: ''
      NORA_LAUNCHER_BASELINE_TAG: ${{ inputs.launcher_baseline_tag }}
      NORA_PRODUCTION_MODE: ${{ inputs.production_mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify accepted Windows source and preserve its exact package bytes
        shell: bash
        run: |
          set -euo pipefail
          node -e 'require("./tooling/release/reuse-windows-build.cjs").verifyModes(process.env)'
          timeout --signal=TERM --kill-after=5s 120s gh api "repos/$GITHUB_REPOSITORY/actions/runs/$NORA_VERIFIED_WINDOWS_RUN" > source-run.json
          timeout --signal=TERM --kill-after=5s 120s gh api "repos/$GITHUB_REPOSITORY/actions/runs/$NORA_VERIFIED_WINDOWS_RUN/artifacts?per_page=100" > source-artifacts.json
          timeout --signal=TERM --kill-after=5s 120s gh api "repos/$GITHUB_REPOSITORY/actions/runs/$NORA_VERIFIED_WINDOWS_RUN/jobs?per_page=100" > source-jobs.json
          node --test tests/launcher-windows-reuse.test.cjs
          node tooling/release/reuse-windows-build.cjs source-run.json source-artifacts.json source-jobs.json "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$NORA_VERIFIED_WINDOWS_RUN" "$RUNNER_TEMP/accepted-windows"
      - name: Preserve accepted Windows delivery without rebuilding
        uses: actions/upload-artifact@v4
        with:
          name: nora-tavern-win32-x64
          overwrite: true
          path: ${{ runner.temp }}/accepted-windows/delivery/**
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Preserve original Windows acceptance and source provenance
        uses: actions/upload-artifact@v4
        with:
          name: nora-operation-acceptance-win32-x64
          overwrite: true
          path: ${{ runner.temp }}/accepted-windows/acceptance/**
          if-no-files-found: error
          retention-days: 90

  build:
    needs: [preflight, reuse-windows]
    if: always() && !cancelled() && needs.preflight.result == 'success' && (needs.reuse-windows.result == 'success' || needs.reuse-windows.result == 'skipped') && inputs.package_source_run == '' && (github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'win32-x64')
    strategy:
      fail-fast: false
      matrix:
        # A final same-commit assembly reuses an accepted Windows package. Windows ARM lacks Liveware.
        include: >-
          ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.target == 'win32-x64'
            && '[{"runner":"windows-latest","platform":"win32","arch":"x64","package_script":"pack:win:x64"}]'
            || inputs.verified_windows_run != ''
            && '[{"runner":"macos-15","platform":"darwin","arch":"arm64","package_script":"pack:mac:arm64"},{"runner":"macos-15-intel","platform":"darwin","arch":"x64","package_script":"pack:mac:x64"}]'
            || '[{"runner":"macos-15","platform":"darwin","arch":"arm64","package_script":"pack:mac:arm64"},{"runner":"macos-15-intel","platform":"darwin","arch":"x64","package_script":"pack:mac:x64"},{"runner":"windows-latest","platform":"win32","arch":"x64","package_script":"pack:win:x64"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    steps:
      - name: Preserve repository bytes on every platform
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify release tag matches committed payload version
        if: github.ref_type == 'tag'
        shell: bash
        run: test "$GITHUB_REF_NAME" = "v$(cat app/.tavern-release-version)"

      - name: Reject conflicting baseline modes
        if: inputs.launcher_baseline_tag != '' && inputs.runtime_source_run != ''
        shell: bash
        run: |
          echo 'Choose a published launcher baseline OR a runtime source run, not both.' >&2
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            app/engine/sillytavern/package-lock.json
            nora-mcp/npm-shrinkwrap.json

      - name: Verify embedded Story Profile before preparing runtimes
        run: node app/engine/sillytavern/build/sync-story-profile-runtime.mjs --check

      - name: Verify source ownership and compatible delivery layout
        run: node --test tests/repository-layout.test.mjs

      - name: Verify launcher build reuse boundaries
        run: node --test tests/launcher-build-baseline.test.mjs tests/launcher-build-package.test.mjs

      - name: Verify artifact check runner before preparing runtimes
        run: node --test tests/launcher-artifact-checks.test.cjs

      - name: Install launcher test dependencies
        working-directory: launcher/desktop
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify cold-profile bootstrap identity before preparing runtimes
        run: node tooling/run.mjs node --test --test-name-pattern="a fresh runtime bootstrap" tests/deployment/launcher_operation_lock.test.cjs

      - name: Download and verify unchanged published components
        if: inputs.launcher_baseline_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_TAG: ${{ inputs.launcher_baseline_tag }}
        shell: bash
        run: node tooling/release/launcher-build-baseline.mjs "$BASELINE_TAG" "${{ matrix.platform }}-${{ matrix.arch }}" "$RUNNER_TEMP/launcher-baseline"

      - name: Fetch official ClawChat plugin for the runtime bundle
        uses: actions/checkout@v4
        with:
          repository: clawling/clawchat-plugin-hermes-agent
          ref: 8651f7078916e60ed1da9f78ec4d1278fef49dd9
          path: .build-clawchat-plugin
          persist-credentials: false

      - name: Keep build inputs outside the release source tree
        shell: bash
        run: mv .build-clawchat-plugin "$RUNNER_TEMP/nora-clawchat-plugin"

      - name: Install Hermes core without browser components (macOS)
        if: runner.os == 'macOS' && inputs.runtime_source_run == '' && inputs.launcher_baseline_tag == ''
        shell: bash
        run: |
          set -euo pipefail
          export HERMES_HOME="$RUNNER_TEMP/hermes"
          export UV_MANAGED_PYTHON=1
          export UV_PYTHON_INSTALL_DIR="$RUNNER_TEMP/nora-python"
          export UV_PYTHON_INSTALL_BIN=0
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh -o "$RUNNER_TEMP/hermes-install.sh"
          sh "$RUNNER_TEMP/hermes-install.sh" \
            --dir "$HERMES_HOME/hermes-agent" \
            --hermes-home "$HERMES_HOME" \
            --skip-setup \
            --skip-browser \
            --skip-computer-use \
            --non-interactive

      - name: Install Hermes core without browser components (Windows)
        if: runner.os == 'Windows' && inputs.runtime_source_run == '' && inputs.launcher_baseline_tag == ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:HERMES_HOME = Join-Path $env:RUNNER_TEMP 'hermes'
          $installer = Join-Path $env:RUNNER_TEMP 'hermes-install.ps1'
          Invoke-WebRequest https://hermes-agent.nousresearch.com/install.ps1 -OutFile $installer
          $stages = @(
            'uv', 'git', 'node', 'system-packages', 'repository', 'python', 'venv',
            'dependencies', 'path', 'config-templates', 'platform-sdks', 'bootstrap-marker'
          )
          foreach ($stage in $stages) {
            & $installer -HermesHome $env:HERMES_HOME `
              -InstallDir (Join-Path $env:HERMES_HOME 'hermes-agent') `
              -Stage $stage -NonInteractive -Json -SkipComputerUse
            if ($LASTEXITCODE -ne 0) { throw "Hermes stage failed: $stage" }
          }

      - name: Build integrated runtime
        if: inputs.runtime_source_run == '' && inputs.launcher_baseline_tag == ''
        shell: bash
        run: |
          node tooling/run.mjs node tooling/release/package-hermes-runtime.mjs \
            --hermes-home "$RUNNER_TEMP/hermes" \
            --output "$RUNNER_TEMP/hermes-runtime" \
            --clawchat-source "$RUNNER_TEMP/nora-clawchat-plugin" \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}"

      - name: Download verified runtime baseline
        if: inputs.runtime_source_run != ''
        uses: actions/download-artifact@v4
        with:
          name: nora-tavern-${{ matrix.platform }}-${{ matrix.arch }}
          overwrite: true
          path: ${{ runner.temp }}/nora-baseline-artifacts
          github-token: ${{ github.token }}
          run-id: ${{ inputs.runtime_source_run }}

      - name: Restore the exact baseline runtime
        if: inputs.runtime_source_run != ''
        shell: bash
        run: node tooling/run.mjs node tooling/release/restore-launcher-runtime.cjs "$RUNNER_TEMP/nora-baseline-artifacts" "$RUNNER_TEMP"

      - name: Restore published runtime for existing installation gates
        if: inputs.launcher_baseline_tag != ''
        shell: bash
        run: node tooling/run.mjs node tooling/release/restore-launcher-runtime.cjs "$RUNNER_TEMP/launcher-baseline" "$RUNNER_TEMP"

      - name: Reseal baseline with current ClawChat integration
        if: inputs.runtime_source_run != ''
        shell: bash
        run: |
          node tooling/run.mjs node tooling/release/package-hermes-runtime.mjs \
            --hermes-home "$RUNNER_TEMP/hermes" \
            --output "$RUNNER_TEMP/hermes-runtime" \
            --clawchat-source "$RUNNER_TEMP/nora-clawchat-plugin" \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}"

      - name: Configure actual operation actors and native lock tests
        shell: bash
        run: |
          py="$RUNNER_TEMP/hermes/hermes-agent/venv/bin/python"
          if [[ "$RUNNER_OS" == "Windows" ]]; then py="$RUNNER_TEMP/hermes/hermes-agent/venv/Scripts/python.exe"; fi
          test -f "$py"
          python_root="$("$py" -B -c 'import sys; print(sys.base_prefix, end="")')"
          node -e 'const fs=require("node:fs"),path=require("node:path");const values={NODE_PATH:path.resolve("launcher/desktop/node_modules"),NORA_TEST_NODE:process.execPath,NORA_TEST_PYTHON:process.argv[1],NORA_TEST_MANAGED_PYTHON_ROOT:process.argv[2],NORA_TEST_HERMES:path.dirname(path.dirname(path.dirname(process.argv[1]))),NORA_TEST_OPERATION_HELPER:path.resolve("deployment/shared/operation_control.py")};fs.appendFileSync(process.env.GITHUB_ENV,Object.entries(values).map(([key,value])=>`${key}=${value}`).join("\n")+"\n")' "$py" "$python_root"

      - name: Verify module-only incremental updater before installation tests
        shell: bash
        run: |
          node --test tests/component-release.test.mjs
          node tooling/run.mjs "$NORA_TEST_PYTHON" -B -m unittest tests.deployment.test_update_recovery.InterruptedRecoveryTests.test_committed_backup_can_be_observed_but_never_recovered tests.deployment.test_update_recovery.InterruptedRecoveryTests.test_committed_backup_tampering_still_refuses_before_stop tests.deployment.test_update_recovery.ManagedInstallRecoveryTests.test_real_install_committed_journal_keeps_sealed_metadata_after_success_cleanup

      - name: Test release channels and update rollback
        id: release_contracts
        continue-on-error: true
        run: node tooling/run.mjs node --test tests/deployment/launcher_releases.test.cjs tests/deployment/launcher_bundle_contract.test.cjs tests/deployment/launcher_system_update.test.cjs tests/deployment/launcher_install_cleanup.test.cjs tests/deployment/launcher_copy.test.cjs tests/deployment/launcher_location.test.cjs tests/deployment/launcher_model_recheck.test.cjs tests/deployment/launcher_publish.test.cjs

      - name: Test installation diagnostics on the target platform
        id: installation_contracts
        continue-on-error: true
        run: node tooling/run.mjs node --test tests/deployment/launcher_diagnostics.test.cjs tests/deployment/launcher_process_output.test.cjs tests/deployment/launcher_network.test.cjs tests/deployment/launcher_install_source.test.cjs tests/deployment/launcher_component_update.test.cjs tests/deployment/launcher_skill_update.test.cjs tests/deployment/launcher_shutdown.test.cjs tests/deployment/launcher_model_config.test.cjs

      - name: Test diagnostic choices, error presentation and download waiting feedback
        id: presentation_contracts
        continue-on-error: true
        run: node tooling/run.mjs node --test tests/deployment/launcher_telemetry.test.cjs tests/deployment/launcher_telemetry_worker.test.cjs tests/deployment/launcher_error_presentation.test.cjs tests/deployment/launcher_ui_feedback.test.cjs tests/deployment/launcher_task_progress.test.cjs

      - name: Require all platform contract checks before native acceptance
        if: ${{ !cancelled() && (steps.release_contracts.outcome != 'success' || steps.installation_contracts.outcome != 'success' || steps.presentation_contracts.outcome != 'success') }}
        run: node -e "console.error('Platform contract checks failed; native acceptance and packaging are blocked.'); process.exit(1)"

      - name: Verify Windows runtime before long acceptance tests
        if: matrix.platform == 'win32'
        timeout-minutes: 15
        shell: bash
        run: |
          mv "$RUNNER_TEMP/hermes" "$RUNNER_TEMP/hermes-build-source"
          trap 'mv "$RUNNER_TEMP/hermes-build-source" "$RUNNER_TEMP/hermes"' EXIT
          node tooling/run.mjs node tests/deployment/launcher_product_refactor_smoke.cjs --runtime-payload "$RUNNER_TEMP/hermes-runtime" --runtime-only --scratch-base "$RUNNER_TEMP/nora-operation-acceptance" --keep

      - name: Verify Windows owned model and profile fixtures before long tests
        if: matrix.platform == 'win32'
        timeout-minutes: 5
        shell: bash
        env:
          NORA_CLAWCHAT_PLUGIN: ${{ runner.temp }}/nora-clawchat-plugin
        run: |
          "$NORA_TEST_PYTHON" -B -c 'import os; from pathlib import Path; assert all(Path(os.environ[key]).is_dir() for key in ["NORA_TEST_HERMES", "NORA_CLAWCHAT_PLUGIN"]), "Native fixture inputs must exist"'
