name: Diagnose sealed Windows model fixture (no product build or publication)
on:
  workflow_dispatch:
    inputs:
      source_run:
        type: string
        default: '41332757445'
      source_commit:
        type: string
        default: '0052f295f1963c321948b9b55e581f71bad47df5'
permissions:
  contents: read
  actions: read
jobs:
  diagnostic:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      ACCEPTANCE_BASELINE_TAG: v2.5.7
      SOURCE_RUN: ${{ inputs.source_run }}
      SOURCE_SHA: ${{ inputs.source_commit }}
      NORA_STAGE_OPTIONS: '{"target":"all","acceptance_baseline_tag":"v2.5.7","app_only":false,"production_mode":true,"planning_baseline":"v2.5.7","approve_unknown_inputs":true,"force_full_regression":false}'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - name: Prepare test-only Node dependencies
        run: npm ci --prefix launcher/desktop --ignore-scripts --no-audit --no-fund
      - name: Restore independently verified source and runtime checkpoints for diagnosis only
        shell: bash
        run: |
          node <<'JS'
          const assert=require('node:assert/strict');
          const {context,restore}=require('./tooling/release/build-stage.cjs');
          assert.equal(process.env.SOURCE_RUN,'41332757445');
          assert.equal(process.env.SOURCE_SHA,'0052f295f1963c321948b9b55e581f71bad47df5');
          const diagnostic=context();
          const original={...diagnostic,runId:Number(process.env.SOURCE_RUN),commit:process.env.SOURCE_SHA,attempt:1};
          (async()=>{
            await restore('source',{expected:original});
            await restore('runtime',{expected:original});
            console.log(JSON.stringify({diagnosticOnly:true,diagnosticCommit:diagnostic.commit,diagnosticRun:diagnostic.runId,runtimeSource:original}));
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
      - name: Materialize sealed Windows interpreter and Hermes
        shell: bash
        run: node "$PWD/tooling/run.mjs" node "$PWD/tooling/release/restore-launcher-runtime.cjs" "$RUNNER_TEMP/hermes-runtime" "$RUNNER_TEMP"
      - name: Configure isolated fixture actor paths
        shell: bash
        run: |
          py="$RUNNER_TEMP/hermes/hermes-agent/venv/Scripts/python.exe"
          python_root="$("$py" -B -c 'import sys; print(sys.base_prefix, end="")')"
          node -e 'const fs=require("node:fs"),path=require("node:path");const values={NODE_PATH:path.resolve("launcher/desktop/node_modules"),NORA_TEST_NODE:process.execPath,NORA_TEST_PYTHON:process.argv[1],NORA_TEST_MANAGED_PYTHON_ROOT:process.argv[2],NORA_TEST_HERMES:path.dirname(path.dirname(path.dirname(process.argv[1]))),NORA_TEST_OPERATION_HELPER:path.resolve("deployment/shared/operation_control.py")};fs.appendFileSync(process.env.GITHUB_ENV,Object.entries(values).map(([key,value])=>`${key}=${value}`).join("\n")+"\n")' "$py" "$python_root"
      - name: Verify corrected model fixture with the real Windows interpreter
        shell: bash
        run: node "$PWD/tooling/run.mjs" "$NORA_TEST_PYTHON" -B -m unittest -v tests.deployment.test_model_provider_skill
      - name: Prepare same-lock engine dependencies for storage verification
        run: npm ci --prefix app/engine/sillytavern --ignore-scripts --no-audit --no-fund
      - name: Verify storage faults and the unchanged real timeout on Windows
        shell: bash
        run: node "$PWD/tooling/run.mjs" node --test "$PWD/app/engine/sillytavern/tests/nora-backup-retention-safety.test.mjs"
      - name: Preserve diagnostic logs only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nora-windows-model-fixture-diagnostics
          path: ${{ runner.temp }}/model-fixture-diagnostics/**
          if-no-files-found: warn
          retention-days: 7
