name: Frozen Windows prompt loader check

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  native-prompt-loader-check:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
      NORA_LOADER_SOURCE_COMMIT: 991afa502365b722199ce7752ff0190ee1c8a328
      NORA_LOADER_SOURCE_RUN: '37948169463'
    steps:
      - name: Preserve source bytes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: 991afa502365b722199ce7752ff0190ee1c8a328
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        id: extractor
        with:
          python-version: '3.11'
      - name: Verify and restore the exact successful Windows artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NORA_LOADER_EXTRACTOR: ${{ steps.extractor.outputs.python-path }}
        run: |
          node <<'JS'
          const assert=require('node:assert/strict'),fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto');
          const {execFileSync}=require('node:child_process');
          const reuse=require('./tooling/release/reuse-windows-build.cjs');
          const env=process.env,commit=env.NORA_LOADER_SOURCE_COMMIT,runId=env.NORA_LOADER_SOURCE_RUN;
          const sha=file=>crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          const read=file=>JSON.parse(fs.readFileSync(file,'utf8').replace(/^\uFEFF/,''));
          const one=items=>{assert.equal(items.length,1,'Expected one frozen package object');return items[0];};
          async function main(){
            assert.equal(process.platform,'win32');assert.equal(process.arch,'x64');
            assert.equal(env.GITHUB_EVENT_NAME,'workflow_dispatch');assert.equal(env.GITHUB_REF_TYPE,'branch');
            assert.equal(env.GITHUB_REF,'refs/heads/codex/launcher-prompt-loader-check');
            assert.equal(env.GITHUB_REPOSITORY,'LoveMaker-art/noras-tavern');assert.match(env.GITHUB_SHA,/^[a-f0-9]{40}$/);
            assert.equal(commit,'991afa502365b722199ce7752ff0190ee1c8a328');assert.equal(runId,'37948169463');
            assert.notEqual(env.GITHUB_RUN_ID,runId);assert.notEqual(env.GITHUB_SHA,commit);
            assert.equal(execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),commit);
            assert.equal(execFileSync('git',['status','--porcelain','--untracked-files=no'],{encoding:'utf8'}).trim(),'');
            // Keep the original helper unchanged while binding its python3 lookup to the native setup-python directory.
            const extractor=fs.realpathSync(env.NORA_LOADER_EXTRACTOR),extractorRoot=path.dirname(extractor);
            const nativeAlias=path.join(extractorRoot,'python3.exe');
            const aliasStat=fs.lstatSync(nativeAlias,{throwIfNoEntry:false});
            if(aliasStat){
              const same=execFileSync(extractor,['-c','import os,sys; print("same" if os.path.samefile(sys.argv[1],sys.executable) else "different")',nativeAlias],{encoding:'utf8'}).trim();
              assert.ok(['same','different'].includes(same));
              if(same==='different'){
                assert.ok(aliasStat.isFile()&&!aliasStat.isSymbolicLink(),'A different Python alias must be a regular identical binary');
                assert.equal(sha(nativeAlias),sha(extractor),'Refusing a Python alias with different executable bytes');
                assert.match(env.GITHUB_RUN_ID,/^[1-9][0-9]*$/);
                const originalAlias=path.join(extractorRoot,`python3.original-${env.GITHUB_RUN_ID}.exe`);assert.ok(!fs.existsSync(originalAlias));
                fs.renameSync(nativeAlias,originalAlias);fs.linkSync(extractor,nativeAlias);
              }
            }else fs.linkSync(extractor,nativeAlias);
            env.PATH=extractorRoot+path.delimiter+env.PATH;
            const alias=JSON.parse(execFileSync('python3',['-c','import json,os,sys; from pathlib import Path; expected=Path(os.environ["NORA_LOADER_EXTRACTOR"]).resolve(); assert os.path.samefile(sys.executable,expected); assert Path(sys.base_prefix).resolve()==expected.parent; print(json.dumps({"executable":sys.executable,"prefix":sys.prefix,"basePrefix":sys.base_prefix,"version":sys.version}))'],{encoding:'utf8'}));
            const api=suffix=>JSON.parse(execFileSync('gh',['api',`repos/${env.GITHUB_REPOSITORY}/actions/${suffix}`],{encoding:'utf8',maxBuffer:8*1024*1024}));
            const run=api(`runs/${runId}`),artifacts=api(`runs/${runId}/artifacts?per_page=100`),jobs=api(`runs/${runId}/jobs?per_page=100`);
            assert.equal(run.head_branch,'codex/launcher-packaging-fixes');assert.equal(run.head_repository.id,run.repository.id);
            const root=path.join(env.RUNNER_TEMP,'nora-prompt-loader-source');
            await reuse.materialize(run,artifacts,jobs,{commit,repository:env.GITHUB_REPOSITORY,runId},root);
            const delivery=path.join(root,'delivery');
            const find=name=>one(fs.readdirSync(delivery,{recursive:true}).filter(file=>path.basename(file)===name).map(file=>path.join(delivery,file)));
            const systemFile=find('nora-system-win32-x64.json'),system=read(systemFile);
            const releaseFile=find(system.files['release-manifest.json'].asset),release=read(releaseFile);
            const runtimeFile=find('win32-x64-nora-hermes-runtime.json'),runtime=read(runtimeFile);
            assert.equal(runtime.platform,'win32');assert.equal(runtime.arch,'x64');assert.equal(runtime.format,'zip');
            assert.match(runtime.archive,/^[A-Za-z0-9._-]+$/);assert.match(runtime.sha256,/^[a-f0-9]{64}$/);
            assert.equal(runtime.sha256,release.hermesRuntime.sha256);assert.equal(runtime.sha256,'16c17af289faa41d33bfb6451c7ec83b56382052eb3ddcf72f76f9346084131c');
            const archive=find('win32-x64-'+runtime.archive);assert.equal(fs.statSync(archive).size,runtime.size);assert.equal(sha(archive),runtime.sha256);
            const prompt='hermes-agent/agent/prompt_builder.py';assert.ok(!runtime.relocatableFiles.includes(prompt));
            const promptArchive=JSON.parse(execFileSync(env.NORA_LOADER_EXTRACTOR,['-c','import hashlib,json,stat,sys,zipfile; name="hermes-runtime/hermes-agent/agent/prompt_builder.py"; z=zipfile.ZipFile(sys.argv[1]); entries=[i for i in z.infolist() if i.filename==name]; assert len(entries)==1; info=entries[0]; assert not info.is_dir() and stat.S_IFMT(info.external_attr>>16) in (0,stat.S_IFREG); data=z.read(info); print(json.dumps({"entry":name,"size":len(data),"sha256":hashlib.sha256(data).hexdigest()}))',archive],{encoding:'utf8'}));
            const firstInstallSha256=sha('deployment/install/first_install.py');assert.equal(firstInstallSha256,release.artifacts['ops/installer/first_install.py']);
            const proof={schema:'nora-prompt-loader-source/1',diagnosticOnly:true,rebuilt:false,publicationAcceptance:false,
              sourceRun:Number(runId),sourceCommit:commit,workflowCommit:env.GITHUB_SHA,workflowRun:Number(env.GITHUB_RUN_ID),
              artifacts:artifacts.artifacts.map(item=>({id:item.id,name:item.name,size:item.size_in_bytes,digest:item.digest})),
              systemManifestSha256:sha(systemFile),releaseManifestSha256:sha(releaseFile),runtimeManifestSha256:sha(runtimeFile),
              runtimeSha256:runtime.sha256,runtimeSize:runtime.size,runtimeManifest:runtimeFile,runtimeArchive:archive,
              promptArchive,firstInstallSha256,testSourceSha256:sha('tests/deployment/test_first_install.py'),extractor:alias};
            const proofFile=path.join(env.RUNNER_TEMP,'nora-prompt-loader-source.json');assert.ok(!fs.existsSync(proofFile));
            fs.writeFileSync(proofFile,JSON.stringify(proof,null,2)+'\n',{flag:'wx'});
            fs.appendFileSync(env.GITHUB_ENV,'NORA_LOADER_ARTIFACTS='+delivery+'\n');
            console.log(`Verified frozen source ${commit}, run ${runId}, two API-bound artifacts and runtime ${runtime.sha256}; no package rebuild.`);
          }
          main().catch(error=>{console.error(error);process.exitCode=1});
          JS
      - name: Prepare the original runtime actor dependencies
        shell: bash
        run: |
          npm ci --prefix launcher/desktop --ignore-scripts --no-audit --no-fund
          node -e 'const fs=require("node:fs"),path=require("node:path");fs.appendFileSync(process.env.GITHUB_ENV,"NORA_TEST_DESKTOP_NODE_MODULES="+path.resolve("launcher/desktop/node_modules")+"\nNODE_PATH="+path.resolve("launcher/desktop/node_modules")+"\n")'
      - name: Restore the accepted native interpreter without packaging
        shell: bash
        run: node tooling/run.mjs node tooling/release/restore-launcher-runtime.cjs "$NORA_LOADER_ARTIFACTS" "$RUNNER_TEMP"
      - name: Exercise the one original official prompt loader test
        shell: bash
        run: |
          python_script="$RUNNER_TEMP/nora-prompt-loader-check.py"
          cat > "$python_script" <<'PY'
          import ast, hashlib, importlib, json, os, platform, sys, unittest
          from pathlib import Path

          def digest(file):
              return hashlib.sha256(Path(file).read_bytes()).hexdigest()

          def exact_result(result):
              return result.testsRun == 1 and not result.errors and not result.failures and not result.skipped

          proof = json.loads((Path(os.environ['RUNNER_TEMP']) / 'nora-prompt-loader-source.json').read_text())
          assert proof['sourceCommit'] == '991afa502365b722199ce7752ff0190ee1c8a328'
          assert proof['sourceRun'] == 37948169463 and proof['diagnosticOnly'] and not proof['rebuilt']
          assert not proof['publicationAcceptance']
          home = Path(os.environ['RUNNER_TEMP']) / 'hermes'
          hermes = home / 'hermes-agent'
          venv = hermes / 'venv'
          expected_python = venv / 'Scripts/python.exe'
          assert platform.system() == 'Windows' and os.path.samefile(sys.executable, expected_python)
          assert Path(sys.prefix).resolve() == venv.resolve() and Path(sys.base_prefix).resolve() == (home / 'python').resolve()
          assert Path(os.environ['NORA_TEST_HERMES_ROOT']).resolve() == hermes.resolve()
          runtime_receipt = json.loads((hermes / '.hermes-bootstrap-complete').read_text())
          assert runtime_receipt['sha256'] == proof['runtimeSha256']
          prompt = hermes / 'agent/prompt_builder.py'
          assert digest(prompt) == proof['promptArchive']['sha256'] and prompt.stat().st_size == proof['promptArchive']['size']
          source = prompt.read_text(encoding='utf-8')
          definitions = {item.name: item for item in ast.parse(source).body if isinstance(item, (ast.FunctionDef, ast.AsyncFunctionDef))}
          functions = {name: hashlib.sha256(ast.get_source_segment(source, definitions[name]).encode()).hexdigest()
                       for name in ['build_context_files_prompt', 'load_soul_md']}
          name = sys.argv[1]
          assert name == 'ops.tests.test_first_install.FirstInstallSnapshotTests.test_official_hermes_loader_reads_complete_agents_not_backup'
          module = importlib.import_module('ops.tests.test_first_install')
          assert digest(module.__file__) == proof['testSourceSha256'] and digest(module.MODULE_PATH) == proof['firstInstallSha256']
          suite = unittest.defaultTestLoader.loadTestsFromName(name)
          assert suite.countTestCases() == 1
          result = unittest.TextTestRunner(verbosity=2, stream=sys.stdout).run(suite)
          assert Path(sys.prefix).resolve() == venv.resolve() and Path(sys.base_prefix).resolve() == (home / 'python').resolve()
          assert digest(prompt) == proof['promptArchive']['sha256']
          accepted = exact_result(result)
          report = {'schema': 'nora-prompt-loader-acceptance/1', 'diagnosticOnly': True, 'rebuilt': False,
                    'publicationAcceptance': False, 'sourceRun': proof['sourceRun'], 'sourceCommit': proof['sourceCommit'],
                    'workflowRun': proof['workflowRun'], 'workflowCommit': proof['workflowCommit'], 'artifacts': proof['artifacts'],
                    'runtimeSha256': proof['runtimeSha256'], 'runtimeManifestSha256': proof['runtimeManifestSha256'],
                    'systemManifestSha256': proof['systemManifestSha256'], 'releaseManifestSha256': proof['releaseManifestSha256'],
                    'test': 'tests.deployment.test_first_install.FirstInstallSnapshotTests.test_official_hermes_loader_reads_complete_agents_not_backup',
                    'testSourceSha256': proof['testSourceSha256'], 'firstInstallSha256': proof['firstInstallSha256'],
                    'actualPython': str(Path(sys.executable).resolve()), 'pythonVersion': sys.version,
                    'prefix': str(Path(sys.prefix).resolve()), 'basePrefix': str(Path(sys.base_prefix).resolve()),
                    'prefixVerifiedBeforeAndAfter': True, 'hermesRoot': str(hermes.resolve()),
                    'hermesPromptSource': {'path': str(prompt.resolve()), 'sha256': digest(prompt), 'archiveEntry': proof['promptArchive']['entry'], 'functionHashes': functions},
                    'testsRun': result.testsRun, 'errors': len(result.errors), 'failures': len(result.failures), 'skipped': len(result.skipped),
                    'accepted': accepted}
          destination = Path(os.environ['RUNNER_TEMP']) / 'nora-prompt-loader-acceptance.json'
          with destination.open('x', encoding='utf-8') as stream:
              json.dump(report, stream, indent=2); stream.write('\n')
          assert accepted, 'The one original loader case must really pass with no skipped tests'
          print('PASS: original official loader case 1/1, no errors, failures or skips; archived Hermes source and native prefixes verified')
          PY
          export NORA_TEST_HERMES_ROOT="$(node -e 'console.log(require("node:path").join(process.env.RUNNER_TEMP,"hermes","hermes-agent"))')"
          py="$(node -e 'console.log(require("node:path").join(process.env.NORA_TEST_HERMES_ROOT,"venv","Scripts","python.exe"))')"
          node tooling/run.mjs "$py" -B "$python_script" tests.deployment.test_first_install.FirstInstallSnapshotTests.test_official_hermes_loader_reads_complete_agents_not_backup
      - name: Preserve only the independently bound loader evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nora-prompt-loader-acceptance
          path: |
            ${{ runner.temp }}/nora-prompt-loader-source.json
            ${{ runner.temp }}/nora-prompt-loader-acceptance.json
          if-no-files-found: warn
          retention-days: 14
