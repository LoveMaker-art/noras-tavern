        shell: bash
        run: |
          release_dir="$(node tooling/checks/launcher-artifact-checks.cjs release)"
          cd "$release_dir/nora-tavern-launcher/desktop"
          npm run "${{ matrix.package_script }}"

      - name: Test the actual Windows setup and installed application
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: pwsh
        run: ./tooling/checks/launcher-installed-check.ps1

      - name: Verify real APP production module closure and executor receipts
        timeout-minutes: 10
        shell: bash
        run: node tooling/checks/launcher-artifact-checks.cjs app

      - name: Preserve isolated operation acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nora-operation-acceptance-${{ matrix.platform }}-${{ matrix.arch }}
          overwrite: true
          path: |
            ${{ runner.temp }}/nora-operation-acceptance/**/harness-result.json
            ${{ runner.temp }}/nora-operation-acceptance/**/harness-*.log
            ${{ runner.temp }}/nora-packaged-app-acceptance.json
            ${{ runner.temp }}/nora-upgrade-baseline-acceptance.json
            ${{ runner.temp }}/nora-upgrade-baseline/baseline-source-receipt.json
            ${{ runner.temp }}/nora-installed-*-acceptance.json
          if-no-files-found: warn
          retention-days: 90


      - name: Verify packaged Nora images and instructions
        shell: bash
        run: node tooling/checks/launcher-artifact-checks.cjs images

      - name: Upload launcher
        uses: actions/upload-artifact@v4
        with:
          name: nora-tavern-${{ matrix.platform }}-${{ matrix.arch }}
          overwrite: true
          path: |
            release/*/nora-tavern-launcher/desktop/dist/Nora-Tavern-*
            release/*/nora-tavern-launcher/desktop/dist/nora-launcher-*.json
            release/*/system-assets/*
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Upload shared updater assets
        if: matrix.platform == 'darwin' && matrix.arch == 'arm64' && (github.ref_type == 'tag' || inputs.production_mode)
        uses: actions/upload-artifact@v4
        with:
          name: nora-tavern-shared
          overwrite: true
          path: |
            release/*/*.tar.gz
            release/*/release-manifest.json
            release/*/bootstrap-manifest.json
            release/*/first-install-manifest.json
            release/*/install-*.sh
            release/*/install-*.ps1
            release/*/*bootstrap.py
            release/*/SHA256SUMS
          if-no-files-found: error
          compression-level: 0

      - name: Preserve built Windows packages when later acceptance fails
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: nora-windows-failed-packaging-diagnostic
          overwrite: true
          path: |
            release/*/nora-tavern-launcher.zip
            release/*/nora-tavern-launcher/desktop/dist/Nora-Tavern-*
            release/*/nora-tavern-launcher/desktop/dist/nora-launcher-*.json
            release/*/system-assets/*
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0
