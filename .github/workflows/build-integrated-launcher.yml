name: Build full Nora Tavern installers

on:
  workflow_dispatch:
    inputs:
      target:
        description: Build all platforms or debug Windows only
        type: choice
        default: all
        options:
          - all
          - win32-x64
          - win32-bootstrap
      runtime_source_run:
        description: Optional verified build run whose Hermes archives are reused for install compatibility
        type: string
        default: ''
      launcher_baseline_tag:
        description: Launcher-only build using verified unchanged components from a stable tag (otherwise full build)
        type: string
        default: ''
      production_mode:
        description: Use real installation paths for replacement testing (branch artifacts only)
        type: boolean
        default: false
      publish_source_run:
        description: Publish an accepted complete build at this tag commit without rebuilding
        type: string
        default: ''
  push:
    tags:
      - 'v*-beta.*'

concurrency:
  group: nora-release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read
  actions: read

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'

jobs:
  bootstrap-contract:
    if: inputs.target == 'win32-bootstrap'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Preserve repository bytes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install native guard dependency
        working-directory: launcher/desktop
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Diagnose Windows identity queries in nine independent cold profiles
        shell: bash
        run: |
          probe="$RUNNER_TEMP/nora-windows-cold-profile-diagnosis.cjs"
          cat > "$probe" <<'NODE'
          const assert=require('node:assert/strict'),fs=require('node:fs'),path=require('node:path');
          const {spawn,execFile}=require('node:child_process');
          const {performance}=require('node:perf_hooks');
          const {randomUUID}=require('node:crypto');
          const root=fs.mkdtempSync(path.join(process.env.RUNNER_TEMP,'nora-windows-identity-diagnosis-'));
          const reportFile=path.join(process.env.RUNNER_TEMP,'nora-windows-cold-profile-diagnosis.json');
          const report={schema:'nora-windows-cold-profile-diagnosis/1',commit:process.env.GITHUB_SHA,
            platform:process.platform,arch:process.arch,node:process.version,root,deadlineMs:30000,
            psModulePath:process.env.PSModulePath||null,cases:[],outcome:'collecting'};
          const save=()=>fs.writeFileSync(reportFile,JSON.stringify(report,null,2)+'\n');
          function environment(profile,noraHome) {
            for(const suffix of ['', 'AppData/Roaming', 'AppData/Local', 'tmp', 'cache'])
              fs.mkdirSync(path.join(profile,suffix),{recursive:true});
            const hermes=path.join(noraHome,'hermes');
            return {HOME:profile,USERPROFILE:profile,HERMES_HOME:profile,NORA_HERMES_HOME:hermes,
              NORA_TAVERN_HOME:noraHome,TAVERN_DATA_ROOT:path.join(noraHome,'tavern'),
              NORA_INSTALLER_DIRECTORY:path.join(noraHome,'installer'),NORA_RELEASE_CHANNEL:'stable',
              APPDATA:path.join(profile,'AppData/Roaming'),LOCALAPPDATA:path.join(profile,'AppData/Local'),
              TMP:path.join(profile,'tmp'),TEMP:path.join(profile,'tmp'),TMPDIR:path.join(profile,'tmp'),
              XDG_CACHE_HOME:path.join(profile,'cache'),XDG_DATA_HOME:path.join(noraHome,'data'),
              PYTHONNOUSERSITE:'1',PYTHONDONTWRITEBYTECODE:'1',PYTHONUTF8:'1',PYTHONIOENCODING:'utf-8',
              SystemRoot:process.env.SystemRoot||'',WINDIR:process.env.WINDIR||'',COMSPEC:process.env.COMSPEC||'',
              ...(process.env.PSModulePath?{PSModulePath:process.env.PSModulePath}:{}),
              PATH:[path.join(hermes,'node/bin'),path.join(hermes,'node'),path.join(hermes,'hermes-agent/venv/bin'),
                path.join(hermes,'hermes-agent/venv/Scripts'),process.env.PATH||''].join(path.delimiter)};
          }
          async function compare(round,method) {
            const noraHome=path.join(root,`round-${round}-${method}`);
            const profile=path.join(noraHome,'installer','operations',randomUUID(),'bootstrap-profile');
            const env=environment(profile,noraHome);
            const record={round,method,profile,identityQuery:method!=='startup',outcome:'failed'};
            report.cases.push(record);save();
            let actor,closed;
            try {
              record.spawnBeforeMs=Date.now();
              actor=spawn(process.execPath,['-e',"process.send({pid:process.pid});setInterval(()=>{},1000)"],
                {env,windowsHide:true,stdio:['ignore','ignore','pipe','ipc']});
              closed=new Promise(resolve=>actor.once('close',(code,signal)=>resolve({code,signal})));
              let actorStderr='';actor.stderr.on('data',value=>actorStderr=(actorStderr+value).slice(-16000));
              await new Promise((resolve,reject)=>{
                const timer=setTimeout(()=>reject(new Error('Owned Node actor did not become ready')),5000);
                actor.once('error',error=>{clearTimeout(timer);reject(error);});
                actor.once('close',()=>{clearTimeout(timer);reject(new Error(`Owned Node actor exited before ready: ${actorStderr}`));});
                actor.once('message',message=>{
                  clearTimeout(timer);
                  try{assert.equal(message.pid,actor.pid);record.pid=actor.pid;record.readyAfterMs=Date.now();resolve();}
                  catch(error){reject(error);}
                });
              });
              assert.equal(actor.exitCode,null);assert.equal(actor.signalCode,null);
              const command=method==='get-process'
                ?`([DateTimeOffset](Get-Process -Id ${actor.pid}).StartTime.ToUniversalTime()).ToUnixTimeMilliseconds()`
                :method==='dotnet'
                  ?`([DateTimeOffset]([System.Diagnostics.Process]::GetProcessById(${actor.pid}).StartTime.ToUniversalTime())).ToUnixTimeMilliseconds()`
                  :"'startup-ready'";
              const started=performance.now();
              const result=await new Promise(resolve=>execFile('powershell.exe',
                ['-NoProfile','-NonInteractive','-Command',command],
                {env,windowsHide:true,timeout:30000,encoding:'utf8',maxBuffer:65536},
                (error,stdout,stderr)=>resolve({error,stdout,stderr})));
              Object.assign(record,{elapsedMs:performance.now()-started,stdout:result.stdout,stderr:result.stderr,
                status:result.error?(result.error.code??null):0,signal:result.error?.signal??null,killed:result.error?.killed??false,
                error:result.error?{name:result.error.name,message:result.error.message,code:result.error.code??null}:null});
              record.actorAliveAfterQuery=actor.exitCode===null&&actor.signalCode===null;
              assert.ok(record.actorAliveAfterQuery,'The queried actor must remain alive');
              if(result.error)throw result.error;
              if(record.identityQuery) {
                assert.match(result.stdout.trim(),/^[1-9][0-9]+$/);
                record.birthTimeMs=Number(result.stdout.trim());
                assert.ok(Number.isSafeInteger(record.birthTimeMs));
                assert.ok(record.birthTimeMs>=record.spawnBeforeMs&&record.birthTimeMs<=record.readyAfterMs,
                  `OS birth time ${record.birthTimeMs} is outside owned actor spawn window ${record.spawnBeforeMs}..${record.readyAfterMs}`);
                record.identityVerified=true;
              } else {assert.equal(result.stdout.trim(),'startup-ready');record.identityVerified=false;}
              record.outcome='passed';
            } catch(error) {record.failure={name:error.name,message:error.message,code:error.code??null};}
            finally {
              if(actor) {
                if(actor.exitCode===null&&actor.signalCode===null)actor.kill('SIGKILL');
                let timer;
                try{record.actorClose=await Promise.race([closed,new Promise((_,reject)=>{
                  timer=setTimeout(()=>reject(new Error('Owned actor did not close after termination')),5000);
                })]);}
                catch(error){record.outcome='failed';record.cleanupError=error.message;}
                finally{clearTimeout(timer);}
              }
              save();console.log('[DEBUG-windows-cold-profile] '+JSON.stringify(record));
            }
          }
          (async()=>{
            assert.equal(process.platform,'win32');
            const methods=['get-process','dotnet','startup'];
            for(let round=0;round<3;round++)for(let index=0;index<3;index++)
              await compare(round+1,methods[(index+round)%methods.length]);
            assert.equal(report.cases.length,9);
            report.outcome=report.cases.every(record=>record.outcome==='passed')?'all-probes-passed':'probe-failed';
            report.startupControlIsIdentityProof=false;
            save();if(report.outcome==='probe-failed')process.exitCode=1;
          })().catch(error=>{report.outcome='harness-failed';report.error={name:error.name,message:error.message};save();console.error(error);process.exitCode=1;});
          NODE
          node "$probe"
      - name: Reproduce cold-profile bootstrap identity before downloading resources
        if: ${{ always() && !cancelled() }}
        run: node tooling/run.mjs node --test --test-name-pattern="a fresh runtime bootstrap" tests/deployment/launcher_operation_lock.test.cjs
      - name: Upload temporary Windows cold-profile diagnosis
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: nora-windows-cold-profile-diagnosis
          path: ${{ runner.temp }}/nora-windows-cold-profile-diagnosis.json
          if-no-files-found: warn
          retention-days: 7

  build:
    if: inputs.publish_source_run == '' && inputs.target != 'win32-bootstrap'
    strategy:
      fail-fast: false
      matrix:
        # Tags always build every supported platform. Windows ARM lacks Liveware.
        include: >-
          ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.target == 'win32-x64'
            && '[{"runner":"windows-latest","platform":"win32","arch":"x64","package_script":"pack:win:x64"}]'
            || '[{"runner":"macos-15","platform":"darwin","arch":"arm64","package_script":"pack:mac:arm64"},{"runner":"macos-15-intel","platform":"darwin","arch":"x64","package_script":"pack:mac:x64"},{"runner":"windows-latest","platform":"win32","arch":"x64","package_script":"pack:win:x64"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    steps:
      - name: Preserve repository bytes on every platform
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify release tag matches committed payload version
        if: github.ref_type == 'tag'
        shell: bash
        run: test "$GITHUB_REF_NAME" = "v$(cat app/.tavern-release-version)"

      - name: Reject conflicting baseline modes
        if: inputs.launcher_baseline_tag != '' && inputs.runtime_source_run != ''
        shell: bash
        run: |
          echo 'Choose a published launcher baseline OR a runtime source run, not both.' >&2
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            app/engine/sillytavern/package-lock.json
            nora-mcp/npm-shrinkwrap.json

      - name: Verify embedded Story Profile before preparing runtimes
        run: node app/engine/sillytavern/build/sync-story-profile-runtime.mjs --check

      - name: Verify source ownership and compatible delivery layout
        run: node --test tests/repository-layout.test.mjs

      - name: Verify launcher build reuse boundaries
        run: node --test tests/launcher-build-baseline.test.mjs tests/launcher-build-package.test.mjs

      - name: Install launcher test dependencies
        working-directory: launcher/desktop
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify cold-profile bootstrap identity before preparing runtimes
        run: node tooling/run.mjs node --test --test-name-pattern="a fresh runtime bootstrap" tests/deployment/launcher_operation_lock.test.cjs

      - name: Download and verify unchanged published components
        if: inputs.launcher_baseline_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_TAG: ${{ inputs.launcher_baseline_tag }}
        shell: bash
        run: node tooling/release/launcher-build-baseline.mjs "$BASELINE_TAG" "${{ matrix.platform }}-${{ matrix.arch }}" "$RUNNER_TEMP/launcher-baseline"

      - name: Fetch official ClawChat plugin for the runtime bundle
        uses: actions/checkout@v4
        with:
          repository: clawling/clawchat-plugin-hermes-agent
          ref: 8651f7078916e60ed1da9f78ec4d1278fef49dd9
          path: .build-clawchat-plugin
          persist-credentials: false

      - name: Keep build inputs outside the release source tree
        shell: bash
        run: mv .build-clawchat-plugin "$RUNNER_TEMP/nora-clawchat-plugin"

      - name: Install Hermes core without browser components (macOS)
        if: runner.os == 'macOS' && inputs.runtime_source_run == '' && inputs.launcher_baseline_tag == ''
        shell: bash
        run: |
          set -euo pipefail
          export HERMES_HOME="$RUNNER_TEMP/hermes"
          export UV_MANAGED_PYTHON=1
          export UV_PYTHON_INSTALL_DIR="$RUNNER_TEMP/nora-python"
          export UV_PYTHON_INSTALL_BIN=0
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh -o "$RUNNER_TEMP/hermes-install.sh"
          sh "$RUNNER_TEMP/hermes-install.sh" \
            --dir "$HERMES_HOME/hermes-agent" \
            --hermes-home "$HERMES_HOME" \
            --skip-setup \
            --skip-browser \
            --skip-computer-use \
            --non-interactive

      - name: Install Hermes core without browser components (Windows)
        if: runner.os == 'Windows' && inputs.runtime_source_run == '' && inputs.launcher_baseline_tag == ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:HERMES_HOME = Join-Path $env:RUNNER_TEMP 'hermes'
          $installer = Join-Path $env:RUNNER_TEMP 'hermes-install.ps1'
          Invoke-WebRequest https://hermes-agent.nousresearch.com/install.ps1 -OutFile $installer
          $stages = @(
            'uv', 'git', 'node', 'system-packages', 'repository', 'python', 'venv',
            'dependencies', 'path', 'config-templates', 'platform-sdks', 'bootstrap-marker'
          )
          foreach ($stage in $stages) {
            & $installer -HermesHome $env:HERMES_HOME `
              -InstallDir (Join-Path $env:HERMES_HOME 'hermes-agent') `
              -Stage $stage -NonInteractive -Json -SkipComputerUse
            if ($LASTEXITCODE -ne 0) { throw "Hermes stage failed: $stage" }
          }

      - name: Build integrated runtime
        if: inputs.runtime_source_run == '' && inputs.launcher_baseline_tag == ''
        shell: bash
        run: |
          node tooling/run.mjs node tooling/release/package-hermes-runtime.mjs \
            --hermes-home "$RUNNER_TEMP/hermes" \
            --output "$RUNNER_TEMP/hermes-runtime" \
            --clawchat-source "$RUNNER_TEMP/nora-clawchat-plugin" \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}"

      - name: Download verified runtime baseline
        if: inputs.runtime_source_run != ''
        uses: actions/download-artifact@v4
        with:
          name: nora-tavern-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/nora-baseline-artifacts
          github-token: ${{ github.token }}
          run-id: ${{ inputs.runtime_source_run }}

      - name: Restore the exact baseline runtime
        if: inputs.runtime_source_run != ''
        shell: bash
        run: node tooling/run.mjs node tooling/release/restore-launcher-runtime.cjs "$RUNNER_TEMP/nora-baseline-artifacts" "$RUNNER_TEMP"

      - name: Restore published runtime for existing installation gates
        if: inputs.launcher_baseline_tag != ''
        shell: bash
        run: node tooling/run.mjs node tooling/release/restore-launcher-runtime.cjs "$RUNNER_TEMP/launcher-baseline" "$RUNNER_TEMP"

      - name: Reseal baseline with current ClawChat integration
        if: inputs.runtime_source_run != ''
        shell: bash
        run: |
          node tooling/run.mjs node tooling/release/package-hermes-runtime.mjs \
            --hermes-home "$RUNNER_TEMP/hermes" \
            --output "$RUNNER_TEMP/hermes-runtime" \
            --clawchat-source "$RUNNER_TEMP/nora-clawchat-plugin" \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}"

      - name: Configure actual operation actors and native lock tests
        shell: bash
        run: |
          py="$RUNNER_TEMP/hermes/hermes-agent/venv/bin/python"
          if [[ "$RUNNER_OS" == "Windows" ]]; then py="$RUNNER_TEMP/hermes/hermes-agent/venv/Scripts/python.exe"; fi
          test -f "$py"
          python_root="$("$py" -B -c 'import sys; print(sys.base_prefix, end="")')"
          node -e 'const fs=require("node:fs"),path=require("node:path");const values={NODE_PATH:path.resolve("launcher/desktop/node_modules"),NORA_TEST_NODE:process.execPath,NORA_TEST_PYTHON:process.argv[1],NORA_TEST_MANAGED_PYTHON_ROOT:process.argv[2],NORA_TEST_HERMES:path.dirname(path.dirname(path.dirname(process.argv[1]))),NORA_TEST_OPERATION_HELPER:path.resolve("deployment/shared/operation_control.py")};fs.appendFileSync(process.env.GITHUB_ENV,Object.entries(values).map(([key,value])=>`${key}=${value}`).join("\n")+"\n")' "$py" "$python_root"

      - name: Test release channels and update rollback
        id: release_contracts
        continue-on-error: true
        run: node tooling/run.mjs node --test tests/deployment/launcher_releases.test.cjs tests/deployment/launcher_bundle_contract.test.cjs tests/deployment/launcher_system_update.test.cjs tests/deployment/launcher_install_cleanup.test.cjs tests/deployment/launcher_copy.test.cjs tests/deployment/launcher_location.test.cjs tests/deployment/launcher_model_recheck.test.cjs tests/deployment/launcher_publish.test.cjs

      - name: Test installation diagnostics on the target platform
        id: installation_contracts
        continue-on-error: true
        run: node tooling/run.mjs node --test tests/deployment/launcher_diagnostics.test.cjs tests/deployment/launcher_process_output.test.cjs tests/deployment/launcher_network.test.cjs tests/deployment/launcher_install_source.test.cjs tests/deployment/launcher_component_update.test.cjs tests/deployment/launcher_skill_update.test.cjs tests/deployment/launcher_shutdown.test.cjs tests/deployment/launcher_model_config.test.cjs

      - name: Test diagnostic choices, error presentation and download waiting feedback
        id: presentation_contracts
        continue-on-error: true
        run: node tooling/run.mjs node --test tests/deployment/launcher_telemetry.test.cjs tests/deployment/launcher_telemetry_worker.test.cjs tests/deployment/launcher_error_presentation.test.cjs tests/deployment/launcher_ui_feedback.test.cjs tests/deployment/launcher_task_progress.test.cjs

      - name: Require all platform contract checks before native acceptance
        if: ${{ !cancelled() && (steps.release_contracts.outcome != 'success' || steps.installation_contracts.outcome != 'success' || steps.presentation_contracts.outcome != 'success') }}
        run: node -e "console.error('Platform contract checks failed; native acceptance and packaging are blocked.'); process.exit(1)"

      - name: Verify Windows runtime before long acceptance tests
        if: matrix.platform == 'win32'
        timeout-minutes: 15
        shell: bash
        run: |
          mv "$RUNNER_TEMP/hermes" "$RUNNER_TEMP/hermes-build-source"
          trap 'mv "$RUNNER_TEMP/hermes-build-source" "$RUNNER_TEMP/hermes"' EXIT
          node tooling/run.mjs node tests/deployment/launcher_product_refactor_smoke.cjs --runtime-payload "$RUNNER_TEMP/hermes-runtime" --runtime-only --scratch-base "$RUNNER_TEMP/nora-operation-acceptance" --keep

      - name: Verify Windows owned model and profile fixtures before long tests
        if: matrix.platform == 'win32'
        timeout-minutes: 5
        shell: bash
        env:
          NORA_CLAWCHAT_PLUGIN: ${{ runner.temp }}/nora-clawchat-plugin
        run: |
          "$NORA_TEST_PYTHON" -B -c 'import os; from pathlib import Path; assert all(Path(os.environ[key]).is_dir() for key in ["NORA_TEST_HERMES", "NORA_CLAWCHAT_PLUGIN"]), "Native fixture inputs must exist"'
          node tooling/run.mjs "$NORA_TEST_PYTHON" -B -m unittest -v tests.deployment.test_nora_profile.BundledProfileIntegrationTests.test_real_bundled_client_initializes_through_cli_and_preserves_customization tests.deployment.test_launcher_model_status.VerifiedModelStatusTests.test_pending_sync_resumes_with_saved_credentials_and_rejects_changed_key tests.deployment.test_launcher_model_status.VerifiedModelStatusTests.test_real_hermes_custom_save_passes_bridge_recheck

      - name: Test operation ownership, evidence, bounded retry and recovery contracts
        timeout-minutes: 10
        run: node tooling/run.mjs node --test --test-reporter=tap tests/deployment/launcher_operation_lock.test.cjs tests/deployment/launcher_operation_state.test.cjs tests/deployment/launcher_operation_inspection.test.cjs tests/deployment/launcher_operation_policy.test.cjs tests/deployment/launcher_operation_result.test.cjs tests/deployment/launcher_operation_cli.test.cjs tests/deployment/launcher_cli_capability.test.cjs tests/deployment/launcher_runtime_transaction.test.cjs tests/deployment/launcher_restore_runtime.test.cjs tests/deployment/launcher_location_admission.test.cjs tests/deployment/launcher_evidence_store.test.cjs tests/deployment/launcher_fault_packet.test.cjs tests/deployment/launcher_diagnostics_operation.test.cjs tests/deployment/launcher_network_policy.test.cjs tests/deployment/launcher_retry_conditions.test.cjs tests/deployment/launcher_release_plan.test.cjs tests/deployment/launcher_update_executor.test.cjs tests/deployment/launcher_guidance_flow.test.cjs tests/deployment/launcher_status_readonly.test.cjs

      - name: Require chat backup safety tests
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix app/engine/sillytavern --ignore-scripts --no-audit --no-fund
          npm ci --prefix nora-mcp --ignore-scripts --no-audit --no-fund
          node --test tests/backup-safety-gate.test.mjs
          node tooling/checks/verify-backup-safety.mjs

      - name: Test native transaction and complete evidence contracts
        shell: bash
        run: node tooling/run.mjs "$NORA_TEST_PYTHON" -B -m unittest tests.deployment.test_operation_control tests.deployment.test_operation_cli tests.deployment.test_operation_evidence tests.deployment.test_native_program_evidence tests.deployment.test_native_install_policy tests.deployment.test_first_install_transaction tests.deployment.test_update_operation_safety tests.deployment.test_mcp_probe tests.deployment.test_model_diagnostics

      - name: Verify runtime independently of original installation
        if: matrix.platform != 'win32'
        timeout-minutes: 15
        shell: bash
        run: |
          mv "$RUNNER_TEMP/hermes" "$RUNNER_TEMP/hermes-build-source"
          trap 'mv "$RUNNER_TEMP/hermes-build-source" "$RUNNER_TEMP/hermes"' EXIT
          node tooling/run.mjs node tests/deployment/launcher_product_refactor_smoke.cjs --runtime-payload "$RUNNER_TEMP/hermes-runtime" --runtime-only --scratch-base "$RUNNER_TEMP/nora-operation-acceptance" --keep

      - name: Test unified update and application replacement
        shell: bash
        run: |
          node tooling/run.mjs node --test tests/deployment/launcher_self_update.test.cjs tests/deployment/launcher_local_release.test.cjs tests/deployment/launcher_recovery_route.test.cjs tests/deployment/launcher_update_package.test.cjs
          py="$RUNNER_TEMP/hermes/hermes-agent/venv/bin/python"
          if [[ "$RUNNER_OS" == "Windows" ]]; then py="$RUNNER_TEMP/hermes/hermes-agent/venv/Scripts/python.exe"; fi
          node tooling/run.mjs "$py" -B -m unittest tests.deployment.test_launcher_replacement -v

      - name: Test Nora initialization and profile synchronization
        shell: bash
        run: |
          py="$RUNNER_TEMP/hermes/hermes-agent/venv/bin/python"
          if [[ "$RUNNER_OS" == "Windows" ]]; then py="$RUNNER_TEMP/hermes/hermes-agent/venv/Scripts/python.exe"; fi
          export NORA_CLAWCHAT_PLUGIN="$RUNNER_TEMP/nora-clawchat-plugin"
          node tooling/run.mjs "$py" -B -m unittest tests.deployment.test_nora_system tests.deployment.test_nora_profile tests.deployment.test_launcher_services tests.deployment.test_first_install tests.deployment.test_launcher_refinement tests.deployment.test_installer_windows_paths tests.deployment.test_launcher_model_status tests.deployment.test_launcher_tavern_model tests.deployment.test_liveware_independent_startup tests.deployment.test_liveware_greeting_order tests.deployment.test_launcher_shared_logic tests.deployment.test_greeting_template tests.deployment.test_update_target tests.deployment.test_update_download_sources tests.deployment.test_managed_update tests.deployment.test_update_lifecycle tests.deployment.test_incremental_update tests.deployment.test_update_dependency_materialization tests.deployment.test_update_recovery tests.deployment.test_launcher_update_recovery tests.deployment.test_update_error_diagnostics tests.deployment.test_native_startup_evidence
          "$py" -B -m unittest tests.deployment.test_updater_skill_environment
          node tooling/run.mjs "$py" -B -m unittest tests.deployment.test_launcher_tracebacks tests.deployment.test_bridge_error_diagnostics tests.deployment.test_native_cli_diagnostics
          node tooling/run.mjs "$py" -B -m unittest tests.deployment.test_native_lifecycle_dependencies
          export NORA_TEST_HERMES="$("$py" -c 'import os; from pathlib import Path; print(Path(os.environ["RUNNER_TEMP"]) / "hermes" / "hermes-agent")')"
          node tooling/run.mjs "$py" -B -m unittest tests.deployment.test_model_provider_skill

      - name: Build release payload
        shell: bash
        env:
          PRODUCTION_MODE: ${{ inputs.production_mode }}
          LAUNCHER_BASELINE: ${{ inputs.launcher_baseline_tag }}
        run: |
          mode=--candidate
          if [[ "$GITHUB_REF_TYPE" == "tag" || "$PRODUCTION_MODE" == "true" ]]; then mode=""; fi
          if [[ -n "$LAUNCHER_BASELINE" ]]; then
            node tooling/release/package-release.mjs $mode --launcher-baseline "$RUNNER_TEMP/launcher-baseline"
          else
            node tooling/release/package-release.mjs $mode \
              --hermes-runtime-manifest "$RUNNER_TEMP/hermes-runtime/nora-hermes-runtime.json"
          fi

      - name: Freeze verified historical payload for version migration acceptance
        if: inputs.runtime_source_run != ''
        shell: bash
        env:
          RUNTIME_SOURCE_RUN: ${{ inputs.runtime_source_run }}
        run: |
          release_dir="$(find release -maxdepth 1 -type d \( -name 'candidate-*' -o -name 'stable-*' \) | sort | tail -n 1)"
          export NORA_UPGRADE_PAYLOAD="$release_dir/nora-tavern-launcher/payload"
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path'),assert=require('node:assert/strict'),crypto=require('node:crypto');
          const semver=require(path.resolve('launcher/desktop/node_modules/semver'));
          const digest=file=>{const hash=crypto.createHash('sha256'),fd=fs.openSync(file,'r'),buffer=Buffer.alloc(1024*1024);try{let count;while((count=fs.readSync(fd,buffer,0,buffer.length,null)))hash.update(buffer.subarray(0,count));}finally{fs.closeSync(fd);}return hash.digest('hex');};
          const safe=name=>{assert.match(name,/^[A-Za-z0-9][A-Za-z0-9._-]*$/);return name;};
          const artifacts=path.join(process.env.RUNNER_TEMP,'nora-baseline-artifacts'),platform=`${process.platform}-${process.arch}`;
          const systemName=`nora-system-${platform}.json`;
          const matches=fs.readdirSync(artifacts,{recursive:true}).filter(name=>path.basename(name)===systemName);
          assert.equal(matches.length,1,'Expected exactly one historical platform system manifest');
          const systemFile=path.join(artifacts,matches[0]),system=JSON.parse(fs.readFileSync(systemFile,'utf8'));
          assert.equal(system.schema,'nora-system/v1');assert.equal(`${system.platform}-${system.arch}`,platform);
          assert.equal(system.candidate,false);assert.equal(system.channel,'stable');assert.match(system.version,/^\d+\.\d+\.\d+$/);
          assert.match(system.commit,/^[a-f0-9]{40}$/);assert.match(process.env.RUNTIME_SOURCE_RUN,/^\d+$/);
          assert.ok(system.files&&typeof system.files==='object'&&!Array.isArray(system.files));
          const baseline=path.join(process.env.RUNNER_TEMP,'nora-upgrade-baseline');fs.mkdirSync(baseline);
          for(const [name,entry] of Object.entries(system.files)){
            safe(name);safe(entry.asset);assert.equal(entry.asset,`${platform}-${name}`);
            assert.match(entry.sha256,/^[a-f0-9]{64}$/);assert.ok(Number.isSafeInteger(entry.size)&&entry.size>=0);
            const file=path.join(path.dirname(systemFile),entry.asset);assert.equal(fs.lstatSync(file).isFile(),true);
            assert.equal(fs.statSync(file).size,entry.size,`Historical component size mismatch: ${name}`);
            assert.equal(digest(file),entry.sha256,`Historical component checksum mismatch: ${name}`);
            fs.copyFileSync(file,path.join(baseline,name));
          }
          fs.copyFileSync(systemFile,path.join(baseline,'nora-system.json'));
          const read=name=>JSON.parse(fs.readFileSync(path.join(baseline,name),'utf8'));
          const identity=read('release-manifest.json');assert.equal(identity.schema,'tavern-release/v2');
          assert.equal(identity.candidate,false);assert.equal(identity.dirty,false);
          assert.equal(identity.commit,system.commit);assert.equal(identity.versions.tavern,system.version);
          for(const entry of Object.values(identity.archives||{}))assert.equal(entry.sha256,system.files[safe(entry.name)]?.sha256);
          for(const [name,key] of [['nora-hermes-runtime.json','hermesRuntime'],['nora-tavern-dependencies.json','dependencies']]){
            const item=read(name);assert.equal(item.schema,1);assert.equal(`${item.platform}-${item.arch}`,platform);
            assert.equal(item.sha256,identity[key]?.sha256);assert.equal(item.sha256,system.files[safe(item.archive)]?.sha256);
          }
          const payload=path.resolve(process.env.NORA_UPGRADE_PAYLOAD),targetFile=path.join(payload,'release-manifest.json');
          const target=JSON.parse(fs.readFileSync(targetFile,'utf8')),version=fs.readFileSync('app/.tavern-release-version','utf8').trim();
          assert.equal(target.versions.tavern,version);assert.equal(target.commit,process.env.GITHUB_SHA);assert.ok(semver.valid(version));
          const comparison=semver.compare(system.version,version);assert.ok(comparison<=0,'Historical baseline cannot be newer than the target');
          const proof={schema:'nora-upgrade-baseline/1',sourceRun:process.env.RUNTIME_SOURCE_RUN,platform,
            baselineVersion:system.version,baselineCommit:system.commit,baselineManifestSha256:digest(path.join(baseline,'release-manifest.json')),
            systemManifestSha256:digest(systemFile),targetVersion:version,targetCommit:target.commit,targetManifestSha256:digest(targetFile),
            verifiedFiles:Object.keys(system.files).length,acceptance:comparison<0?'version-transition-required':'same-version-repair-only'};
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'nora-upgrade-baseline-acceptance.json'),JSON.stringify(proof,null,2)+'\n');
          fs.appendFileSync(process.env.GITHUB_ENV,`NORA_UPGRADE_REQUIRED=${comparison<0}\nNORA_UPGRADE_BASELINE=${baseline}\nNORA_UPGRADE_PAYLOAD=${payload}\n`);
          function migrate(){
            const fs=require('node:fs'),path=require('node:path'),assert=require('node:assert/strict'),crypto=require('node:crypto'),{execFileSync}=require('node:child_process');
            const state=process.argv[2];assert.ok(['running','stopped'].includes(state));
            const proof=JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP,'nora-upgrade-baseline-acceptance.json'),'utf8'));
            assert.equal(proof.acceptance,'version-transition-required');assert.equal(proof.platform,`${process.platform}-${process.arch}`);
            const base=path.join(process.env.RUNNER_TEMP,'nora-operation-acceptance',`upgrade-${state}`);
            execFileSync(process.execPath,['tooling/run.mjs','node','tests/deployment/launcher_product_refactor_smoke.cjs',
              '--payload',process.env.NORA_UPGRADE_PAYLOAD,'--baseline-release',process.env.NORA_UPGRADE_BASELINE,
              '--update-release',process.env.NORA_UPGRADE_PAYLOAD,'--start-state',state,'--scratch-base',base,'--keep'],{stdio:'inherit'});
            const matches=fs.readdirSync(base,{recursive:true}).filter(name=>path.basename(name)==='harness-result.json');
            assert.equal(matches.length,1,'Expected exactly one retained historical migration report');
            const file=path.join(base,matches[0]),report=JSON.parse(fs.readFileSync(file,'utf8'));
            assert.equal(report.outcome,'passed');assert.equal(report.platform,process.platform);assert.equal(report.arch,process.arch);
            assert.equal(report.actorSourceBinding,'verified-selected-candidate-manifest');assert.equal(report.releaseManifestSha256,proof.targetManifestSha256);
            assert.equal(report.releaseAcceptance,'isolated-version-transition');assert.equal(report.update,'verified-content-transition');assert.ok(report.changedSourceArtifacts>0);
            assert.equal(report.updateInitialService,state);assert.equal(report.userData,'retained');assert.equal(report.executorHandles,'verified-closed');
            const installed=JSON.parse(fs.readFileSync(path.join(report.root,'tavern/tavern-updates/installed.json'),'utf8'));
            assert.equal(installed.version,proof.targetVersion);
            const hash=file=>crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
            assert.equal(hash(path.join(process.env.NORA_UPGRADE_BASELINE,'release-manifest.json')),proof.baselineManifestSha256);
            assert.equal(hash(path.join(process.env.NORA_UPGRADE_PAYLOAD,'release-manifest.json')),proof.targetManifestSha256);
            report.versionTransition={...proof,startState:state};fs.writeFileSync(file,JSON.stringify(report,null,2)+'\n');
          }
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'nora-upgrade-migration.cjs'),`(${migrate.toString()})();\n`);
          console.log(JSON.stringify(proof));
          NODE

      - name: Test real fresh installation and managed update before desktop packaging
        if: runner.os != 'Windows'
        timeout-minutes: 15
        shell: bash
        run: |
          mv "$RUNNER_TEMP/hermes" "$RUNNER_TEMP/hermes-build-source"
          release_dir="$(find release -maxdepth 1 -type d \( -name 'candidate-*' -o -name 'stable-*' \) | sort | tail -n 1)"
          node tooling/run.mjs node tests/deployment/launcher_product_refactor_smoke.cjs --payload "$release_dir/nora-tavern-launcher/payload" \
            --update-release "$release_dir/nora-tavern-launcher/payload" --missing-system-receipt \
            --scratch-base "$RUNNER_TEMP/nora-operation-acceptance" --keep

      - name: Test historical version migration with running and stopped Tavern
        if: runner.os != 'Windows' && env.NORA_UPGRADE_REQUIRED == 'true'
        timeout-minutes: 25
        shell: bash
        run: |
          node "$RUNNER_TEMP/nora-upgrade-migration.cjs" running
          node "$RUNNER_TEMP/nora-upgrade-migration.cjs" stopped

      - name: Test Windows installation and managed update with legacy path limits
        if: runner.os == 'Windows'
        timeout-minutes: 40
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $registry = 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem'
          $previous = Get-ItemPropertyValue -Path $registry -Name LongPathsEnabled -ErrorAction SilentlyContinue
          try {
            Set-ItemProperty -Path $registry -Name LongPathsEnabled -Type DWord -Value 0
            if ((Get-ItemPropertyValue -Path $registry -Name LongPathsEnabled) -ne 0) {
              throw 'Windows long-path test precondition was not applied'
            }
            node tooling/run.mjs node --test tests/deployment/launcher_install_cleanup.test.cjs
            if ($LASTEXITCODE -ne 0) { throw 'Windows retry cleanup failed with LongPathsEnabled=0' }
            $python = Join-Path $env:RUNNER_TEMP 'hermes/hermes-agent/venv/Scripts/python.exe'
            node tooling/run.mjs $python -B -m unittest tests.deployment.test_installer_windows_paths tests.deployment.test_update_recovery -v
            if ($LASTEXITCODE -ne 0) { throw 'Windows filesystem regression tests failed' }
            Move-Item (Join-Path $env:RUNNER_TEMP 'hermes') (Join-Path $env:RUNNER_TEMP 'hermes-build-source')
            $release = Get-ChildItem release -Directory |
              Where-Object { $_.Name -match '^(candidate|stable)-' } |
              Sort-Object Name | Select-Object -Last 1
            if (-not $release) { throw 'Candidate release payload is missing' }
            $payload = Join-Path $release.FullName 'nora-tavern-launcher/payload'
            node tooling/run.mjs node tests/deployment/launcher_product_refactor_smoke.cjs --payload $payload --update-release $payload --missing-system-receipt --scratch-base (Join-Path $env:RUNNER_TEMP 'nora-operation-acceptance') --keep
            if ($LASTEXITCODE -ne 0) { throw 'Windows install or managed update failed with LongPathsEnabled=0' }
            if ($env:NORA_UPGRADE_REQUIRED -eq 'true') {
              foreach ($state in @('running', 'stopped')) {
                node (Join-Path $env:RUNNER_TEMP 'nora-upgrade-migration.cjs') $state
                if ($LASTEXITCODE -ne 0) { throw "Historical migration failed with LongPathsEnabled=0 and $state Tavern" }
              }
            }
          } finally {
            if ($null -eq $previous) {
              Remove-ItemProperty -Path $registry -Name LongPathsEnabled -ErrorAction SilentlyContinue
            } else {
              Set-ItemProperty -Path $registry -Name LongPathsEnabled -Type DWord -Value $previous
            }
          }

      - name: Install desktop packaging dependencies
        shell: bash
        run: |
          release_dir="$(find release -maxdepth 1 -type d \( -name 'candidate-*' -o -name 'stable-*' \) | sort | tail -n 1)"
          cd "$release_dir/nora-tavern-launcher/desktop"
          npm ci --no-audit --no-fund

      - name: Build lightweight launcher replacement
        shell: bash
        run: |
          release_dir="$(find release -maxdepth 1 -type d \( -name 'candidate-*' -o -name 'stable-*' \) | sort | tail -n 1)"
          node tooling/release/package-launcher-update.cjs "$release_dir/nora-tavern-launcher/desktop" "${{ matrix.platform }}" "${{ matrix.arch }}"

      - name: Verify actual lightweight update archive
        shell: bash
        run: |
          archive="$(find release -path '*/desktop/dist/*-update.zip' | head -n 1)"
          release_dir="$(find release -maxdepth 1 -type d \( -name 'candidate-*' -o -name 'stable-*' \) | sort | tail -n 1)"
          py="$RUNNER_TEMP/hermes-build-source/hermes-agent/venv/bin/python"
          if [[ "$RUNNER_OS" == "Windows" ]]; then py="$RUNNER_TEMP/hermes-build-source/python/python.exe"; fi
          export NORA_TEST_LAUNCHER_ARCHIVE="$(node -e 'console.log(require("node:path").resolve(process.argv[1]))' "$archive")"
          export NORA_TEST_LAUNCHER_DESKTOP="$(node -e 'console.log(require("node:path").resolve(process.argv[1]))' "$release_dir/nora-tavern-launcher/desktop")"
          node tooling/run.mjs "$py" -B -m unittest tests.deployment.test_launcher_replacement -v

      - name: Assemble full installers from the same verified payload
        shell: bash
        run: |
          release_dir="$(find release -maxdepth 1 -type d \( -name 'candidate-*' -o -name 'stable-*' \) | sort | tail -n 1)"
          cd "$release_dir/nora-tavern-launcher/desktop"
          npm run "${{ matrix.package_script }}"

      - name: Test the actual Windows setup and installed application
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Get-ChildItem release -Directory |
            Where-Object { $_.Name -match '^(candidate|stable)-' } |
            Sort-Object Name | Select-Object -Last 1
          if (-not $release) { throw 'Release payload is missing' }
          $launcher = Join-Path $release.FullName 'nora-tavern-launcher'
          $desktop = Join-Path $launcher 'desktop'
          $dist = Join-Path $desktop 'dist'
          $setup = @(Get-ChildItem $dist -File -Filter '*-win-x64-setup.exe')
          if ($setup.Count -ne 1) { throw 'Expected exactly one actual Windows setup' }
          $package = Get-Content (Join-Path $desktop 'package.json') -Raw | ConvertFrom-Json
          if ($package.build.nsis.oneClick -ne $false -or $package.build.nsis.script) {
            throw 'This gate requires the packaged assisted NSIS template'
          }
          $template = Get-Content (Join-Path $desktop 'node_modules/app-builder-lib/templates/nsis/installSection.nsh') -Raw
          if ($template -notmatch '\$\{if\}\s+\$\{isForceRun\}\s+\$\{andIf\}\s+\$\{Silent\}') {
            throw 'The pinned NSIS template no longer proves silent installation requires force-run to launch'
          }
          $include = Get-Content (Join-Path $desktop $package.build.nsis.include) -Raw
          if ($include -match '!macro\s+customInstall\b') { throw 'A custom installation hook requires separate launch acceptance' }
          foreach ($registry in @('HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall', 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall', 'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall')) {
            $existing = @(Get-ChildItem $registry -ErrorAction SilentlyContinue |
              Get-ItemProperty -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName -eq $package.build.productName })
            if ($existing.Count) { throw 'This fresh setup gate must not invoke an existing installation uninstaller' }
          }
          $installRoot = Join-Path (Join-Path $env:RUNNER_TEMP 'Nora 用户安装验收') 'app'
          if ($installRoot.Length -ge 248 -or (Test-Path $installRoot)) { throw 'Expected a fresh short isolated setup directory' }
          # NSIS /D must be last and unquoted even with spaces. /S without force-run
          # does not launch the app in the pinned assisted installer template.
          $installer = Start-Process -FilePath $setup[0].FullName -ArgumentList "/S /currentuser /D=$installRoot" -PassThru
          if (-not $installer.WaitForExit(240000)) {
            taskkill /PID $installer.Id /T /F
            throw 'Actual Windows setup timed out'
          }
          if ($installer.ExitCode -ne 0) { throw "Actual Windows setup exited $($installer.ExitCode)" }
          $unpacked = Join-Path $dist 'win-unpacked'
          $main = @(Get-ChildItem $unpacked -File -Filter '*.exe')
          if ($main.Count -ne 1) { throw 'Expected one original unpacked main executable' }
          $executable = Join-Path $installRoot $main[0].Name
          if (-not (Test-Path $executable -PathType Leaf)) { throw 'Setup did not install the main executable at the requested directory' }
          $checked = 0
          foreach ($file in (Get-ChildItem $unpacked -Recurse -File -Force)) {
            $relative = [System.IO.Path]::GetRelativePath($unpacked, $file.FullName)
            $installed = Join-Path $installRoot $relative
            if (-not (Test-Path $installed -PathType Leaf)) { throw "Setup omitted $relative" }
            if ((Get-FileHash $file.FullName -Algorithm SHA256).Hash -ne (Get-FileHash $installed -Algorithm SHA256).Hash) {
              throw "Setup changed packaged bytes: $relative"
            }
            $checked++
          }
          if (@(Get-Process | Where-Object { $_.Path -eq $executable }).Count) { throw 'Silent setup unexpectedly launched the installed application' }
          $setupProof = @{schema='nora-installed-setup/1'; installer=$setup[0].Name; installerSha256=(Get-FileHash $setup[0].FullName -Algorithm SHA256).Hash.ToLower(); exitCode=$installer.ExitCode; installRoot=$installRoot; verifiedUnpackedFiles=$checked; autoLaunch=$false}
          $setupProof | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $env:RUNNER_TEMP 'nora-installed-setup-acceptance.json') -Encoding utf8
          $env:NORA_CANDIDATE_LAUNCHER = $launcher
          $env:NORA_PACKED_DESKTOP = Join-Path $installRoot 'resources/app.asar'
          $env:NORA_TEST_PYTHON = Join-Path $env:RUNNER_TEMP 'hermes-build-source/python/python.exe'
          $env:NORA_GATE_REPORT = Join-Path $env:RUNNER_TEMP 'nora-installed-app-acceptance.json'
          $env:ELECTRON_RUN_AS_NODE = '1'
          & $executable --test tests/deployment/launcher_packaged_app.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'The actual installed application gate failed' }
          if (-not (Test-Path $env:NORA_GATE_REPORT -PathType Leaf)) { throw 'Installed application acceptance report is missing' }

      - name: Verify real APP production module closure and executor receipts
        timeout-minutes: 10
        shell: bash
        run: |
          release_dir="$(find release -maxdepth 1 -type d \( -name 'candidate-*' -o -name 'stable-*' \) | sort | tail -n 1)"
          export NORA_CANDIDATE_LAUNCHER="$(node -e 'console.log(require("node:path").resolve(process.argv[1]))' "$release_dir/nora-tavern-launcher")"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            executable="$(find "$release_dir/nora-tavern-launcher/desktop/dist" -path '*/win-unpacked/*.exe' | head -n 1)"
            resources="$(dirname "$executable")/resources"
          else
            executable="$(find "$release_dir/nora-tavern-launcher/desktop/dist" -path '*.app/Contents/MacOS/*' -type f | head -n 1)"
            resources="$(dirname "$executable")/../Resources"
          fi
          test -f "$executable"
          export NORA_PACKED_DESKTOP="$(node -e 'console.log(require("node:path").resolve(process.argv[1]))' "$resources/app.asar")"
          export NORA_TEST_PYTHON="$RUNNER_TEMP/hermes-build-source/hermes-agent/venv/bin/python"
          if [[ "$RUNNER_OS" == "Windows" ]]; then export NORA_TEST_PYTHON="$RUNNER_TEMP/hermes-build-source/python/python.exe"; fi
          export NORA_GATE_REPORT="$RUNNER_TEMP/nora-packaged-app-acceptance.json"
          ELECTRON_RUN_AS_NODE=1 "$executable" --test tests/deployment/launcher_packaged_app.test.cjs

      - name: Preserve isolated operation acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nora-operation-acceptance-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/nora-operation-acceptance/**/harness-result.json
            ${{ runner.temp }}/nora-operation-acceptance/**/harness-*.log
            ${{ runner.temp }}/nora-packaged-app-acceptance.json
            ${{ runner.temp }}/nora-upgrade-baseline-acceptance.json
            ${{ runner.temp }}/nora-installed-*-acceptance.json
          if-no-files-found: warn
          retention-days: 14

      - name: Verify packaged Nora images and instructions
        shell: bash
        run: |
          release_dir="$(find release -maxdepth 1 -type d \( -name 'candidate-*' -o -name 'stable-*' \) | sort | tail -n 1)"
          node tooling/run.mjs node tests/deployment/verify_launcher_package.cjs "$release_dir/nora-tavern-launcher/desktop/dist"

      - name: Upload launcher
        uses: actions/upload-artifact@v4
        with:
          name: nora-tavern-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*/nora-tavern-launcher/desktop/dist/Nora-Tavern-*
            release/*/nora-tavern-launcher/desktop/dist/nora-launcher-*.json
            release/*/system-assets/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload shared updater assets
        if: matrix.platform == 'darwin' && matrix.arch == 'arm64' && (github.ref_type == 'tag' || inputs.production_mode)
        uses: actions/upload-artifact@v4
        with:
          name: nora-tavern-shared
          path: |
            release/*/*.tar.gz
            release/*/release-manifest.json
            release/*/bootstrap-manifest.json
            release/*/first-install-manifest.json
            release/*/install-*.sh
            release/*/install-*.ps1
            release/*/*bootstrap.py
            release/*/SHA256SUMS
          if-no-files-found: error
          compression-level: 0

  publish-release:
    if: always() && !cancelled() && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && (github.event_name != 'workflow_dispatch' || inputs.target == 'all') && (needs.build.result == 'success' || inputs.publish_source_run != '')
    needs: build
    runs-on: ubuntu-latest
    # Different version tags share mutable SourceForge channel pointers.
    concurrency:
      group: nora-sourceforge-release-channels
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare private SourceForge publishing credentials
        env:
          NORA_SF_USERNAME: ${{ vars.SOURCEFORGE_USERNAME }}
          NORA_SF_PRIVATE_KEY: ${{ secrets.SOURCEFORGE_SSH_PRIVATE_KEY }}
          NORA_SF_KNOWN_HOSTS: ${{ secrets.SOURCEFORGE_KNOWN_HOSTS }}
        run: node tooling/release/sourceforge-credentials.mjs prepare
      - name: Verify shared publication configuration
        run: node --test tests/sourceforge-publishing.test.mjs
      - name: Verify accepted source build before publishing without rebuilding
        if: inputs.publish_source_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_SOURCE_RUN: ${{ inputs.publish_source_run }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PUBLISH_SOURCE_RUN" =~ ^[1-9][0-9]*$ ]]
          test "$GITHUB_REF_NAME" = "v$(cat app/.tavern-release-version)"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PUBLISH_SOURCE_RUN" > source-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PUBLISH_SOURCE_RUN/artifacts?per_page=100" > source-artifacts.json
          node --test tests/launcher-publish-source.test.cjs
          node tooling/release/verify-publish-source.cjs source-run.json source-artifacts.json "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$PUBLISH_SOURCE_RUN"
      - uses: actions/download-artifact@v4
        with:
          pattern: nora-tavern-*
          path: artifacts
          run-id: ${{ inputs.publish_source_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Publish only after all platform builds pass
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          for platform in darwin-arm64 darwin-x64 win32-x64; do
            test "$(find artifacts -name "nora-system-$platform.json" | wc -l)" -eq 1
          done
          node --test tests/launcher-release-notes.test.cjs
          node tooling/release/publish-release.mjs artifacts "$TAG" "$GITHUB_SHA" full
      - name: Remove private SourceForge publishing files
        if: always()
        run: node tooling/release/sourceforge-credentials.mjs cleanup
